[project]
name = "factory"
version = "0.1.0"
description = "The factory, reimplemented by v1 of itself"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
    "PyGithub==2.10.0",
    "ruamel.yaml==0.19.1",
    "python-frontmatter==1.3.0",
]

[project.scripts]
# The commands v1.1 installs. Each module's entry function is `main() -> int` (factory.entry).
factory-check-story = "factory.entry.check_story:main"
factory-bill = "factory.entry.bill:main"
factory-watch = "factory.entry.watch:main"
factory-run = "factory.entry.run:main"
factory-health = "factory.entry.health:main"

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "semgrep==1.180.0",
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pip-licenses==5.5.5",
    "pytest-xdist==3.8.0",
    "pylint==4.1.3",
    "vulture==2.16",
    "mutmut==3.8.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

# --- Lint and format ---------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md", "planning"]   # stories carry illustrative code blocks, not code; planning/ is the human's

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "C90", "S", "D"]
# Magic values are fine in small code; domain errors keep noun names; magic methods and
# __init__ need no docstring. (Packages do: D104 stays on, every layer package says what it holds.)
ignore = ["PLR2004", "N818", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913", "D"]  # asserts and fixtures are the point of tests
"src/factory/adapters/claude_runtime.py" = ["PLR0913"]  # F0014-S0003 pins the runtime's six-argument constructor; no noqa in the source
"src/factory/adapters/opencode_runtime.py" = ["PLR0913"]  # F0020-S0004 pins the second runtime's constructor beside the first's; no noqa in the source
"src/factory/adapters/make_commands.py" = ["PLR0913"]  # F0046-S0002 pins the check commands' constructor with the extras and the bundle; no noqa in the source

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["factory"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

# --- Types -------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# --- Layers ------------------------------------------------------------------
# A higher layer may import a lower one, never the other way round (R8).
[tool.importlinter]
root_package = "factory"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["factory.entry", "factory.adapters", "factory.application", "factory.domain"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache: pytest's cache is of no use in a stage's throwaway container.
addopts = "-q --strict-markers -p no:cacheprovider"
# The kill-to-rerun seconds reach the JUnit report only in the xunit1 family (F0011 acceptance).
junit_family = "xunit1"
# Only the folders of failed tests stay in /tmp (the disk filled up on 2026-10-16).
tmp_path_retention_policy = "failed"

[tool.uv]
# Every sync writes .venv's bytecode, so the dataset's base keeps it (F0044, decision 8).
compile-bytecode = true

[tool.coverage.run]
source = ["src/factory"]
branch = true
data_file = ".reports/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true

# --- SAST --------------------------------------------------------------------
[tool.bandit]
targets = ["src"]

# --- Mutation testing (make mutants, outside make check) ---------------------
[tool.mutmut]
source_paths = ["src/factory/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The structural tests read the source, which mutmut rewrites with its own trampoline import; they
# kill no mutant, so its runs leave them out.
pytest_add_cli_args = [
    "-p", "no:cov",
    "--deselect", "tests/domain/test_hosting.py::test_domain_modules_import_only_stdlib_pydantic_and_domain",
    "--deselect", "tests/domain/test_hosting.py::test_application_hosting_imports_only_stdlib_and_domain",
    "--deselect", "tests/test_agent_home_wiring.py::test_the_agent_definition_reader_is_built_once_from_the_settings_agent_home",
    "--deselect", "tests/test_atomic_replace_search.py::test_exactly_one_call_of_os_replace_exists_in_the_package",
    "--deselect", "tests/test_no_state_copies.py::test_no_function_but_the_allowed_two_checks_a_state_itself",
    "--deselect", "tests/test_process_search.py::test_the_only_suppression_markers_are_the_four_in_the_process_wrapper",
    "--deselect", "tests/entry/test_contract.py::test_the_committed_schemas_are_the_generated_ones",
    "--deselect", "tests/test_agent_launch_search.py::test_neither_runtime_module_reads_os_environ",
    "--deselect", "tests/test_agent_launch_search.py::test_the_launch_module_does_not_import_the_process_module",
    "--deselect", "tests/adapters/test_process_streaming.py::test_run_process_shares_the_one_popen_line_and_reports_no_stop",
    "--deselect", "tests/test_opencode_runtime_search.py::test_neither_the_opencode_runtime_nor_the_launch_module_reads_os_environ",
]
# The tests read these from the repository root; mutmut runs them in its own copy.
also_copy = ["claude/", "demo/", "docs/", "factory/", "security/", "template/", "vm/", "README.md", "Makefile", "pyproject.toml", "uv.lock", ".secrets.baseline"]
