# factory-rf's pipeline definition: v1.1 builds this repository since the handover.
# Its predecessor is v1's stage table, factory/v1/stages.yml at the tag planning-history-2026-10-19: the same
# stages, write paths, caps and project commands, in v1.1's names. Every time is in minutes.
contract: "1.0"
attempts_cap: 2             # v1's max_attempts: agent runs that end without a result before the factory asks
crash_cap: 2
acceptance_stage: acceptance
project_commands:
  # The gate; a passed result is reused while the files it reads, the pipeline definition and the image stay the same.
  check: {time_limit: 8, not_read: ["README.md", "docs/*.md", "factory/features/*.md", "factory/features/*.jsonl", "factory/stops.jsonl", "planning/*", "session-logs/*"]}
  lint: {time_limit: 5}
  test: {time_limit: 10}
  duplicates: {time_limit: 2}   # similar and dead code against security/duplicates-baseline.txt, for the reviewer
  documents: {time_limit: 2}    # the four documents against the document check: a check of the docs stage only
  secrets: {time_limit: 3}      # detect-secrets over the files changed on the branch, the documents and journals that check's not_read leaves out
  sync: {time_limit: 5}         # v1.2: the checkout's tools after a checkout; the stage environment runs it, no stage lists it
# The write paths keep v1's lanes. Every stage's own work item is written by the factory
# (the journal, the state, the cost records); a role names it only when its agent edits the text.
# A role's time_limit plus the time_limits of its stage's checks and reports stay within its lease_duration.
roles:
  intake: {write_paths: ["{work_item}"], time_limit: 40, lease_duration: 60}
  tester: {write_paths: ["tests/*"], time_limit: 40, lease_duration: 60}
  coder: {write_paths: ["src/*", "template/*", "claude/*", "vm/*"], time_limit: 40, lease_duration: 60}
  reviewer: {write_paths: ["{work_item}"], time_limit: 40, lease_duration: 60}
  documenter: {write_paths: ["README.md", "docs/*"], time_limit: 40, lease_duration: 60}
  smoke-tester: {write_paths: ["{work_item}"], time_limit: 40, lease_duration: 60}
  # Mutation testing runs only by sweep, outside the factory (the human, 2026-10-19); without make mutants
  # the acceptances of 2026-10-19 took at most about 22 minutes, so it has the other roles' limits.
  acceptance-reviewer: {write_paths: ["{work_item}", "{feature}/backlog/*"], time_limit: 40, lease_duration: 60}
stages:
  intake: {role: intake, next: [tests]}
  tests: {role: tester, next: [doing], checks: [lint], reports: [test]}     # the new tests are red on purpose
  doing: {role: coder, next: [review, tests], checks: [check], reports: [duplicates]}
  review: {role: reviewer, next: [docs, doing], round_cap: 2}
  docs: {role: documenter, next: [smoke-test, doing], checks: [check, secrets, documents], round_cap: 2}
  smoke-test: {role: smoke-tester, next: [approval, doing, docs], round_cap: 2}
  acceptance: {role: acceptance-reviewer, next: [approval]}
  approval: {approval: true, next: [done, doing]}   # the human: a merge accepts, a close sends back
  done: {}
