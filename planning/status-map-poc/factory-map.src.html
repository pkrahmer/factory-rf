<meta charset="utf-8">
<title>Factory Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: header with source and feature; the map (work items at their start | stage columns, time runs down) beside the selection's text. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2320; --muted:#5f6a64; --line:#d9ddd9; --grid:#e8ebe8;
  --accent:#2f6f5e; --wait:#b7791f; --cap:#8a4fb8; --stall:#b42318; --ok:#2f6f5e; --run:#1f5fae; --sel:#1d2320;
  --seg-l:46%; --seg-s:42%;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1c211f; --ink:#e4e8e5; --muted:#9aa59f; --line:#2f3633; --grid:#232926;
  --accent:#6fbfa6; --wait:#e0a84f; --cap:#c39be6; --stall:#f07a6a; --ok:#6fbfa6; --run:#7aa8e6; --sel:#e4e8e5; --seg-l:62%; --seg-s:40%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1c211f; --ink:#e4e8e5; --muted:#9aa59f; --line:#2f3633; --grid:#232926;
  --accent:#6fbfa6; --wait:#e0a84f; --cap:#c39be6; --stall:#f07a6a; --ok:#6fbfa6; --run:#7aa8e6; --sel:#e4e8e5; --seg-l:62%; --seg-s:40%; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
header h1{font-size:18px;font-weight:600;margin:0}
.btn,select,input{font:inherit;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px}
.btn{cursor:pointer;font-weight:600}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.source{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
.source .pill{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:9px;padding:1px 8px}
.source .pill.live{color:var(--ok);border-color:var(--ok)}
form.live{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
form.live label{display:flex;gap:6px;align-items:center;color:var(--muted)}
form.live input{width:16em} form.live .err{color:var(--stall);flex-basis:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column}
.pane h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 12px 6px;font-weight:600}
.scroll{overflow:auto;min-height:0;flex:1}
.badge{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
.b-done{color:var(--ok)} .b-run{color:var(--run)} .b-stall{color:var(--stall)} .b-wait{color:var(--wait)} .b-idle{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.gutter{position:sticky;left:0;z-index:2;background:var(--panel);border-right:1px solid var(--line)}
.heads .gutterhead{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 6px}
.label{all:unset;box-sizing:border-box;position:absolute;left:4px;right:4px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;gap:1px 6px;align-items:center;height:38px;padding:2px 4px;border-radius:4px;cursor:pointer;font-size:12px;line-height:1.3}
.label .when{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.label .badge{justify-self:end;font-size:9px;padding:0 5px}
.label .name .dot{display:inline-block;margin-right:5px;vertical-align:1px}
.featbar .when{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.label .name{grid-column:1/-1}
.label:hover{background:var(--grid)} .label[aria-current="true"]{background:var(--grid);box-shadow:inset 2px 0 0 var(--sel)}
.label:focus-visible,.stagehead:focus-visible,.seg:focus-visible,.feat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.label .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .label .fid{font-family:var(--f-mono);font-size:10.5px;font-weight:600}
.featbar{padding:0 12px 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.feat-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center;max-width:100%;font-weight:600;font-size:13px;padding:3px 6px;border-radius:4px}
.feat-btn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-btn[aria-current="true"]{background:var(--grid)}
.mapwrap{overflow:auto;flex:1;min-height:0;position:relative}
.map{position:relative}
.heads{position:sticky;top:0;z-index:3;display:grid;background:var(--panel);border-bottom:1px solid var(--line)}
.stagehead{all:unset;cursor:pointer;text-align:center;padding:8px 2px;font-weight:600;font-size:12px;border-left:1px solid var(--grid)}
.stagehead small{display:block;font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:10px}
.stagehead[aria-current="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.body{position:relative}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.tick{position:absolute;left:0;right:0;z-index:3;pointer-events:none;border-top:1px dashed var(--grid);font-family:var(--f-mono);font-size:10px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums}
.gap{position:absolute;left:0;right:0;height:14px;z-index:1;pointer-events:none;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px) center/100% 1px no-repeat;border-block:1px solid var(--grid)}
.gap span{position:sticky;left:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted);background:var(--panel);padding:0 4px;z-index:3;position:relative;top:-1px}
.seg{position:absolute;border-radius:3px;cursor:pointer;min-height:3px}
.seg.wait{background:repeating-linear-gradient(135deg,var(--wait) 0 3px,transparent 3px 6px)!important;opacity:.85}
.seg.wait.cap{background:repeating-linear-gradient(135deg,var(--cap) 0 3px,transparent 3px 6px)!important}
.seg.stalled{outline:2px solid var(--stall);outline-offset:-1px}
.seg.running{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.seg.running{animation:none}}
svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.dim .seg:not(.on){opacity:.18} .dim svg path:not(.on){opacity:.12}
.qmark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--wait);border:2px solid var(--panel);transform:translate(-50%,-50%);pointer-events:none}
.xmark{position:absolute;width:9px;height:9px;background:var(--stall);border:2px solid var(--panel);transform:translate(-50%,-50%) rotate(45deg);pointer-events:none}
.detail{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.detail h3{margin:0;font-size:16px;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0}
pre{font-family:var(--f-mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-width:100%;box-sizing:border-box}
.tablewrap{overflow-x:auto}
table.runs{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
table.runs td,table.runs th{border-bottom:1px solid var(--grid);padding:3px 5px;text-align:left;white-space:nowrap}
table.runs th{color:var(--muted);font-weight:500}
table.runs td.num,table.runs th.num{text-align:right}
table.runs tr[data-feature]{cursor:pointer} table.runs tr[data-feature]:hover td{background:var(--grid)}
a{color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:0}
.part{display:flex;flex-direction:column;gap:4px}
.part h4{margin:6px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
details.chap,details.visit{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
details>summary{cursor:pointer;padding:6px 10px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";color:var(--muted);font-size:10px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details>summary::before{transition:none}}
details.chap>summary{font-weight:600}
details[open]>:not(summary){margin:0 10px 8px}
.vstage{font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:60px}
.vwho{color:var(--muted);font-size:12px}
.vtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-left:auto}
.vout{font-family:var(--f-mono);font-size:11px}
details.visit{border-left:3px solid var(--ok)}
details.visit.back{border-left-color:var(--wait)} details.visit.ask{border-left-color:var(--run)} details.visit.stall{border-left-color:var(--stall)} details.visit.human{border-left-color:var(--muted)}
.entry{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;padding-top:4px;border-top:1px dashed var(--grid)}
.entry:first-of-type{border-top:0}
.enum{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.rec{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.txt{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5}
.md{font-size:12.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.md>:first-child{margin-top:0} .md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol{margin:0 0 .55em} .md ul,.md ol{padding-left:1.3em} .md li{margin:.15em 0}
.md h1,.md h2,.md h3,.md h4{font-size:12.5px;margin:.8em 0 .3em}
.md code{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);padding:0 3px;border-radius:3px}
.md pre{margin:.4em 0 .6em;overflow-x:auto;white-space:pre} .md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:11.5px;display:block;overflow-x:auto;max-width:100%;margin:.4em 0 .6em}
.md th,.md td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.md a{color:var(--accent)} .md strong{font-weight:600}
.empty{padding:40px 20px;color:var(--muted);text-align:center}
@media (max-width:900px){
  body{height:auto} main{grid-template-columns:1fr;grid-auto-rows:auto}
  .mapwrap{max-height:75vh} .source{margin-left:0}
}
</style>

<header>
  <h1>Factory Map</h1>
  <select id="feature" aria-label="Feature"></select>
  <span class="source"><span class="pill" id="srcpill">snapshot</span><span id="srctext"></span><button class="btn" id="liveBtn" type="button" aria-expanded="false">Read live</button></span>
</header>
<form class="live" id="liveForm" hidden>
  <label for="repo">Repository <input id="repo" value="pkrahmer/factory-rf" autocomplete="off" spellcheck="false"></label>
  <label for="branch">Branch <input id="branch" value="main" style="width:7em" autocomplete="off" spellcheck="false"></label>
  <label for="token">Read-only token <input id="token" type="password" autocomplete="off" placeholder="fine-grained, Contents: read"></label>
  <button class="btn" type="submit">Connect</button>
  <span class="hint">The token stays in this page's memory and goes only to api.github.com.</span>
  <span class="err" id="liveErr" hidden></span>
</form>
<div class="legend">
  <span><i style="background:hsl(160 40% 50%)"></i>agent run (a stage visit)</span>
  <span><i style="background:repeating-linear-gradient(135deg,var(--wait) 0 3px,transparent 3px 6px)"></i>waiting for the human</span>
  <span><i style="background:repeating-linear-gradient(135deg,var(--cap) 0 3px,transparent 3px 6px)"></i>waiting at a cap</span>
  <span><i style="outline:2px solid var(--stall);outline-offset:-1px"></i>stalled or crashed</span>
  <span><i style="background:var(--wait);border-radius:50%;width:8px;height:8px"></i>question</span>
</div>
<main>
  <section class="pane" aria-label="Stages over time"><h2>Work items and stages · time runs down</h2><div class="featbar" id="featbar"></div>
    <div class="mapwrap" id="mapwrap"><div class="map" id="map"><div class="heads" id="heads"></div><div class="body" id="mbody"></div></div></div></section>
  <section class="pane" aria-label="Selection"><h2 id="dtitle">Factory</h2><div class="scroll"><div class="detail" id="detail"></div></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
// ---------------------------------------------------------------------------------------------
// Reading. Every state, time, cost and outcome comes from the pipeline definition (YAML), a work
// item's front matter (YAML) or its cost sidecar (JSON lines). Markdown is only displayed.
// ---------------------------------------------------------------------------------------------
const ITEM_RE = /^factory\/features\/([^/]+)\/(backlog|in-progress|done)\/((F\d{4}-[SA]\d{4})[^/]*)\.md$/;
const WANTED = p => p === 'factory/pipeline.yml' || p === 'factory/stops.jsonl' || /^claude\/agents\/[^/]+\.md$/.test(p)
  || /^factory\/features\/[^/]+\/feature\.md$/.test(p) || /^factory\/features\/[^/]+\/(backlog|in-progress|done)\/[^/]+\.(md|costs\.jsonl)$/.test(p);
const HUMAN_CAUSES = { question: 'a question', round_cap: 'the round cap', attempts_cap: 'the attempts cap', crash_cap: 'the crash cap' };
const ENDS_RUN = new Set(['result', 'question', 'stall', 'crash', 'expiry']);

function splitFrontMatter(text) {
  const t = text.replace(/\r\n/g, '\n');
  const m = /^---\n([\s\S]*?)\n---\n?([\s\S]*)$/.exec(t);
  if (!m) return { meta: {}, body: t };
  return { meta: jsyaml.load(m[1]) || {}, body: m[2] };
}
function jsonLines(text) {
  return (text || '').split('\n').filter(l => l.trim()).flatMap(l => { try { return [JSON.parse(l)]; } catch { return []; } });
}
const firstHeading = body => (/^# (.+)$/m.exec(body) || [, ''])[1].replace(/`/g, '');
const ts = s => Date.parse(s);

function buildModel(files, now) {
  const pipeline = jsyaml.load(files['factory/pipeline.yml'] || 'stages: {}') || {};
  const stages = Object.entries(pipeline.stages || {}).map(([id, s]) => ({ id, ...(s || {}) }));
  const order = Object.fromEntries(stages.map((s, i) => [s.id, i]));
  const roles = pipeline.roles || {};
  const features = {};
  for (const [path, text] of Object.entries(files)) {
    const f = /^factory\/features\/([^/]+)\/feature\.md$/.exec(path);
    if (f) features[f[1]] = { folder: f[1], id: f[1].slice(0, 5), title: firstHeading(text) || f[1], text, items: [] };
  }
  for (const [path, text] of Object.entries(files)) {
    const m = ITEM_RE.exec(path);
    if (!m) continue;
    const [, folder, place, name, id] = m;
    const feature = features[folder] || (features[folder] = { folder, id: folder.slice(0, 5), title: folder, text: '', items: [] });
    const { meta, body } = splitFrontMatter(text);
    const costs = jsonLines(files[path.replace(/\.md$/, '.costs.jsonl')]);
    feature.items.push(deriveItem({ id, name, place, meta, body, costs, order, now }));
  }
  for (const f of Object.values(features)) f.items.sort((a, b) => (a.first ?? Infinity) - (b.first ?? Infinity) || a.id.localeCompare(b.id));
  const stops = jsonLines(files['factory/stops.jsonl']);
  return { pipeline, stages, order, roles, features, stops, agents: files, hasStops: 'factory/stops.jsonl' in files };
}

// A work item's records become stage visits, waits for the human, marks and totals.
function deriveItem({ id, name, place, meta, body, costs, order, now }) {
  const journal = (meta.journal || []).slice().sort((a, b) => a.number - b.number);
  const byRun = Object.fromEntries(costs.map(c => [c.run, c]));
  const visits = [], waits = [], marks = [];
  let open = null;
  const close = (rec, outcome) => { open.end = ts(rec.at); open.outcome = outcome; open.endRecord = rec.number; open = null; };
  journal.forEach((r, k) => {
    if (r.kind === 'started') {
      if (open) close(r, 'lost');
      open = { stage: r.stage, start: ts(r.at), startRecord: r.number, records: [] };
      visits.push(open);
    } else if (open && ENDS_RUN.has(r.kind) && r.stage === open.stage) {
      if (r.run) { open.run = r.run; open.cost = byRun[r.run]; }
      close(r, r.kind);
    }
    if (r.kind === 'stall' || r.kind === 'crash' || r.kind === 'expiry') marks.push({ kind: r.kind, stage: r.stage, t: ts(r.at), reason: r.reason });
    if (r.kind === 'question') {
      const ans = journal.slice(k + 1).find(x => x.kind === 'comment' && x.speaker === 'human');
      const cause = r.blocked || (r.speaker === 'factory' ? 'a cap' : 'question');
      waits.push({ stage: r.stage, start: ts(r.at), end: ans ? ts(ans.at) : (meta.blocked ? now : ts(r.at)), open: !ans && !!meta.blocked, cause, record: r.number, kind: 'question' });
    }
  });
  if (open) { open.end = null; open.outcome = 'running'; }
  // A visit's outcome is where the item went next: a step to the left in the pipeline is a send-back.
  visits.forEach((v, i) => {
    const next = visits[i + 1];
    v.next = next ? next.stage : null;
    v.sendBack = !!next && v.outcome === 'result' && order[next.stage] < order[v.stage];
  });
  // The approval wait: from the last result to the `done` record, or to now while the item is in approval.
  const done = journal.find(r => r.kind === 'done');
  const lastResult = [...journal].reverse().find(r => r.kind === 'result');
  if (lastResult && (done || meta.stage === 'approval') && 'approval' in order)
    waits.push({ stage: 'approval', start: ts(lastResult.at), end: done ? ts(done.at) : now, open: !done, cause: 'approval', kind: 'approval' });
  const cost = costs.reduce((a, c) => a + (+c.cost_usd || 0), 0);
  const agentSeconds = costs.reduce((a, c) => a + (c.duration_seconds || 0), 0);
  const humanSeconds = waits.reduce((a, w) => a + Math.max(0, w.end - w.start) / 1000, 0);
  const times = journal.map(r => ts(r.at)).filter(Number.isFinite);
  let status = ['backlog', 'b-idle'];
  if (place === 'done' || meta.stage === 'done') status = ['done', 'b-done'];
  else if (meta.blocked) status = [meta.blocked.replace('_', ' '), 'b-wait'];
  else if (meta.stage === 'approval') status = ['approval', 'b-wait'];
  else if (open) status = ['running', 'b-run'];
  else if (place === 'in-progress') status = ['queued', 'b-run'];
  if (marks.length && status[0] !== 'done' && status[0] !== 'running' && !meta.blocked) status = ['stalled', 'b-stall'];
  return {
    id, name, place, meta, body, costs, journal, visits, waits, marks, cost, agentSeconds, humanSeconds, status,
    title: firstHeading(body) || name, acceptance: /-A\d{4}$/.test(id),
    first: times.length ? Math.min(...times) : null, last: times.length ? Math.max(...times) : null,
    questions: waits.filter(w => w.kind === 'question').length, sendBacks: visits.filter(v => v.sendBack).length,
  };
}

// ---------------------------------------------------------------------------------------------
// Sources: the embedded snapshot, or the GitHub REST API (a blob is fetched again only when its sha changed).
// ---------------------------------------------------------------------------------------------
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const live = { repo: null, branch: null, token: null, etag: null, blobs: {}, files: null, timer: null, at: null, refs: {} };
async function gh(path, extra = {}) {
  const r = await fetch('https://api.github.com' + path, { headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + live.token, 'X-GitHub-Api-Version': '2022-11-28', ...extra } });
  return r;
}
async function readLive() {
  const r = await gh(`/repos/${live.repo}/git/trees/${encodeURIComponent(live.branch)}?recursive=1`, live.etag ? { 'If-None-Match': live.etag } : {});
  if (r.status === 304) return false;
  if (!r.ok) throw new Error(`GitHub answered ${r.status} for the file list of ${live.repo}@${live.branch}${r.status === 404 ? ' (no such repository or branch, or the token cannot read it)' : r.status === 401 ? ' (the token was refused)' : ''}.`);
  live.etag = r.headers.get('ETag');
  const tree = (await r.json()).tree.filter(e => e.type === 'blob' && WANTED(e.path));
  const files = {};
  await Promise.all(tree.map(async e => {
    if (!live.blobs[e.sha]) {
      const b = await gh(`/repos/${live.repo}/git/blobs/${e.sha}`, { Accept: 'application/vnd.github.raw+json' });
      if (!b.ok) throw new Error(`GitHub answered ${b.status} for ${e.path}.`);
      live.blobs[e.sha] = await b.text();
    }
    files[e.path] = live.blobs[e.sha];
  }));
  live.main = files;
  await readBranches();
  return true;
}
// A work item in progress keeps its journal and cost records on its branch `work-item/<id>` until the merge.
async function readBranches() {
  const files = { ...live.main };
  let changed = false;
  await Promise.all(Object.keys(live.main).map(async path => {
    const m = /^factory\/features\/[^/]+\/in-progress\/(F\d{4}-[SA]\d{4})[^/]*\.md$/.exec(path);
    if (!m) return;
    const ref = 'work-item/' + m[1], known = live.refs[ref];
    const r = await gh(`/repos/${live.repo}/git/ref/heads/${ref}`, known?.etag ? { 'If-None-Match': known.etag } : {});
    if (r.status === 304) { Object.assign(files, known.files); return; }
    if (!r.ok) return;
    const sha = (await r.json()).object.sha, got = {};
    for (const p of [path, path.replace(/\.md$/, '.costs.jsonl')]) {
      const b = await gh(`/repos/${live.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${sha}`, { Accept: 'application/vnd.github.raw+json' });
      if (b.ok) got[p] = await b.text();
    }
    live.refs[ref] = { etag: r.headers.get('ETag'), files: got };
    Object.assign(files, got); changed = true;
  }));
  live.files = files; live.at = Date.now();
  return changed;
}

// ---------------------------------------------------------------------------------------------
// Drawing.
// ---------------------------------------------------------------------------------------------
const COLW = 92, LEFT = matchMedia('(max-width: 600px)').matches ? 158 : 200, PX = 2.4 / 60e3, GAP_MS = 40 * 60e3, GAP_PX = 22;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hm = t => new Date(t).toISOString().slice(11, 16);
const day = t => new Date(t).toISOString().slice(0, 10);
const mins = s => (s / 60).toFixed(1);
const hours = s => s >= 3600 ? (s / 3600).toFixed(1) + ' h' : Math.round(s / 60) + ' min';
const usd = n => '$' + n.toFixed(2);
let M = null, F = null, sel = { kind: 'factory' }, axis = null;

function renderText(t) {
  if (window.marked && window.DOMPurify) return `<div class="md">${DOMPurify.sanitize(marked.parse(t, { gfm: true }))}</div>`;
  return `<div class="txt">${esc(t)}</div>`;
}
// Display only: the body's "## " chapters, and the journal's entries by number, shown beside the records.
function chapters(body) {
  const out = []; let cur = null, fence = false;
  for (const line of body.split('\n')) {
    if (/^\s*```/.test(line)) fence = !fence;
    const h = !fence && /^## (.+)$/.exec(line);
    if (h) { cur = { title: h[1], lines: [] }; out.push(cur); } else if (cur) cur.lines.push(line);
  }
  const j = out.findIndex(c => /^Journal\b/.test(c.title));
  const journal = {};
  if (j >= 0) {
    let n = null;
    for (const line of out.splice(j, 1)[0].lines) {
      const m = /^(\d+)\. (.*)$/.exec(line);
      if (m) { n = +m[1]; journal[n] = m[2]; } else if (n !== null) journal[n] += '\n' + line.replace(/^ {3}/, '');
    }
  }
  return { chapters: out.map(c => ({ title: c.title, body: c.lines.join('\n').trim() })), journal };
}

// The time axis folds idle gaps longer than GAP_MS, so a feature that ran over two days still fits.
function makeAxis(intervals) {
  const iv = intervals.filter(([a, b]) => Number.isFinite(a)).map(([a, b]) => [a, Number.isFinite(b) ? b : a]).sort((x, y) => x[0] - y[0]);
  const blocks = [];
  for (const [a, b] of iv) {
    const last = blocks[blocks.length - 1];
    if (last && a <= last[1] + GAP_MS) last[1] = Math.max(last[1], b); else blocks.push([a, b]);
  }
  let off = 12; const segs = [];
  for (const [a, b] of blocks) { segs.push({ a, b, y0: off }); off += (b - a) * PX + GAP_PX; }
  const y = t => {
    for (let i = segs.length - 1; i >= 0; i--) if (t >= segs[i].a) return segs[i].y0 + Math.min(t - segs[i].a, segs[i].b - segs[i].a) * PX;
    return 12;
  };
  return { y, segs, height: off + 10 };
}

function render() {
  const feats = Object.values(M.features).sort((a, b) => a.folder.localeCompare(b.folder));
  const pick = $('feature');
  pick.innerHTML = feats.map(f => `<option value="${esc(f.folder)}">${esc(f.id)} · ${esc(f.title)}</option>`).join('');
  if (!F || !M.features[F]) F = (feats.slice().reverse().find(f => f.items.some(i => i.first)) || feats[0] || {}).folder;
  pick.value = F;
  drawMap();
  select(sel.kind, sel.id, true);
}

function drawMap() {
  const f = M.features[F], stages = M.stages, order = M.order;
  const now = Date.now();
  const items = f ? f.items.filter(d => d.first) : [];
  const heads = $('heads'), mbody = $('mbody'), map = $('map');
  if (!items.length) {
    heads.innerHTML = ''; map.style.width = '';
    mbody.style.height = ''; mbody.innerHTML = `<div class="empty">No work item of this feature has started yet.</div>`;
    return;
  }
  const iv = [];
  items.forEach(d => { d.visits.forEach(v => iv.push([v.start, v.end ?? now])); d.waits.forEach(w => iv.push([w.start, w.end])); iv.push([d.first, d.last]); });
  axis = makeAxis(iv);
  const { y } = axis, H = axis.height;
  const W = LEFT + COLW * stages.length;
  map.style.width = W + 'px';
  heads.style.gridTemplateColumns = `${LEFT}px repeat(${stages.length},${COLW}px)`;
  mbody.style.height = H + 'px';
  const ds = [...new Set(items.map(d => day(d.first)))].sort(), days = ds.length > 1 ? `${ds[0]} – ${ds[ds.length - 1]}` : ds[0];
  $('featbar').innerHTML = `<button class="feat-btn" data-feature="1" title="${esc(f.title)}"><span class="dot" style="background:var(--accent)"></span><span>${esc(f.id)} ${esc(f.title)}</span></button><span class="when">${esc(days)}</span>`;
  heads.innerHTML = `<div class="gutterhead"></div>` +
    stages.map(s => `<button class="stagehead" data-stage="${esc(s.id)}">${esc(s.id)}<small>${esc(s.role || (s.approval ? 'human' : s.id === 'done' ? 'merged' : ''))}</small></button>`).join('');
  let html = '', paths = '';
  axis.segs.forEach((s, i) => {
    if (i > 0) html += `<div class="gap" style="top:${s.y0 - GAP_PX + 4}px"><span style="margin-left:${LEFT}px">${esc(day(axis.segs[i - 1].b) === day(s.a) ? '' : day(s.a) + ' ')}${hm(axis.segs[i - 1].b)}–${hm(s.a)} idle</span></div>`;
    const startHour = Math.ceil(s.a / 36e5) * 36e5;
    for (let t = startHour; t < s.b; t += 36e5) html += `<div class="tick" style="top:${y(t)}px"></div>`;
  });
  stages.forEach((s, i) => { html += `<div class="col" style="left:${LEFT + i * COLW}px;width:${COLW}px"></div>`; });
  items.forEach((d, k) => {
    d.hue = (k * 47 + 160) % 360;
    const col = `hsl(${d.hue} var(--seg-s) var(--seg-l))`, lane = (k % 3) * 9, pts = [];
    const bar = (stage, a, b, cls, title) => {
      const i = order[stage];
      if (i === undefined) return null;
      const top = y(a), bot = y(b ?? now), x = LEFT + i * COLW + 14 + lane;
      html += `<div class="seg ${cls}" tabindex="0" data-item="${esc(d.id)}" title="${esc(title)}" style="left:${x}px;width:${COLW - 40}px;top:${top}px;height:${Math.max(3, bot - top)}px;background:${col}"></div>`;
      return [x + (COLW - 40) / 2, top, Math.max(top + 3, bot)];
    };
    d.visits.forEach(v => {
      const c = v.cost;
      const p = bar(v.stage, v.start, v.end, v.outcome === 'running' ? 'running' : (v.outcome === 'stall' || v.outcome === 'crash' || v.outcome === 'lost') ? 'stalled' : '',
        `${d.id} · ${v.stage} · ${v.outcome}${c ? ` · ${mins(c.duration_seconds)} min · ${usd(+c.cost_usd)}` : ''}`);
      if (p) pts.push(p);
    });
    d.waits.forEach(w => {
      const p = bar(w.stage, w.start, w.end, 'wait' + (/cap/.test(w.cause) ? ' cap' : '') + (w.open ? ' running' : ''), `${d.id} · waiting for the human at ${w.stage} (${HUMAN_CAUSES[w.cause] || w.cause}) · ${hours((w.end - w.start) / 1000)}`);
      if (!p) return;
      if (w.kind === 'question') html += `<div class="qmark" style="left:${p[0]}px;top:${p[1]}px"></div>`; else pts.push(p);
    });
    d.marks.forEach(m => {
      const i = order[m.stage]; if (i === undefined) return;
      html += `<div class="xmark" style="left:${LEFT + i * COLW + 14 + lane + (COLW - 40) / 2}px;top:${y(m.t)}px" title="${esc(m.kind)}"></div>`;
    });
    const done = d.journal.find(r => r.kind === 'done');
    if (done && order.done !== undefined) {
      const bx = LEFT + order.done * COLW + COLW / 2, by = y(ts(done.at));
      pts.push([bx, by, by]);
      html += `<div class="seg" data-item="${esc(d.id)}" tabindex="0" title="${esc(d.id)} merged ${hm(ts(done.at))}" style="left:${bx - 5}px;width:10px;top:${by - 5}px;height:10px;border-radius:50%;background:${col}"></div>`;
    }
    pts.sort((p, q) => p[1] - q[1]);
    let dp = '';
    for (let j = 1; j < pts.length; j++) {
      const [x0, , b0] = pts[j - 1], [x1, t1] = pts[j], m = (b0 + t1) / 2;
      dp += `M${x0},${b0} C${x0},${m} ${x1},${m} ${x1},${t1} `;
    }
    if (dp) paths += `<path data-item="${esc(d.id)}" d="${dp}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
  });
  let gutter = `<div class="gutter" style="height:100%;width:${LEFT}px">`, lastY = -99;
  items.forEach(d => {
    const top = Math.max(y(d.first) - 6, lastY + 41); lastY = top;
    gutter += `<button class="label" data-item="${esc(d.id)}" style="top:${top}px" title="${esc(d.title)}"><span class="when">${hm(d.first)}</span><span class="fid">${esc(d.id.slice(6))}</span><span class="badge ${d.status[1]}">${esc(d.status[0])}</span><span class="name"><span class="dot" style="background:hsl(${d.hue} var(--seg-s) var(--seg-l))"></span>${esc(d.title)}</span></button>`;
  });
  mbody.style.height = Math.max(H, lastY + 44) + 'px';
  mbody.innerHTML = gutter + '</div>' + html + `<svg class="links" width="${W}" height="${H}">${paths}</svg>`;
}

function itemPanel(d) {
  const { chapters: chs, journal: text } = chapters(d.body);
  const c = d.meta;
  const visitHtml = [];
  // Group the records into the stage visits; records outside a visit (the human's, the factory's) stand alone.
  const inVisit = new Map();
  d.visits.forEach((v, i) => { for (const r of d.journal) if (r.number >= v.startRecord && (v.endRecord == null || r.number <= v.endRecord)) inVisit.set(r.number, i); });
  let lastGroup = null;
  for (const r of d.journal) {
    const g = inVisit.has(r.number) ? 'v' + inVisit.get(r.number) : 'r' + r.number;
    if (g === lastGroup) { visitHtml[visitHtml.length - 1].recs.push(r); continue; }
    lastGroup = g;
    visitHtml.push({ g, recs: [r], visit: inVisit.has(r.number) ? d.visits[inVisit.get(r.number)] : null });
  }
  const groups = visitHtml.map(({ recs, visit: v }) => {
    const entries = recs.map(r => `<div class="entry"><span class="enum">${r.number}</span><div><div class="rec">${esc(r.speaker)} · ${esc(r.kind)}${r.blocked ? ' · blocked ' + esc(r.blocked) : ''}${r.reason ? ' · ' + esc(r.reason) : ''} · ${hm(ts(r.at))}</div>${text[r.number] ? renderText(text[r.number]) : ''}</div></div>`).join('');
    if (!v) {
      const r = recs[0];
      return `<details class="visit human"><summary><span class="vstage">${esc(r.stage || '')}</span><span class="vwho">${esc(r.speaker)}</span><span class="vtime">${hm(ts(r.at))}</span><span class="vout">${esc(r.kind)}</span></summary>${entries}</details>`;
    }
    const cc = v.cost;
    const time = `${hm(v.start)} · ${v.end ? mins((v.end - v.start) / 1000) + ' min' : 'running'}${cc ? ' · ' + usd(+cc.cost_usd) : ''}`;
    const out = v.outcome === 'result' ? (v.next ? '→ ' + v.next : '→ approval') : v.outcome;
    const cls = v.outcome === 'stall' || v.outcome === 'crash' || v.outcome === 'lost' ? ' stall' : v.outcome === 'question' ? ' ask' : v.sendBack ? ' back' : '';
    return `<details class="visit${cls}"><summary><span class="vstage">${esc(v.stage)}</span><span class="vwho">${esc(M.stages[M.order[v.stage]]?.role || '')}</span><span class="vtime">${time}</span><span class="vout">${esc(out)}</span></summary>${entries}</details>`;
  }).join('');
  const waits = d.waits.map(w => `<tr><td>${esc(w.stage)}</td><td>${esc(HUMAN_CAUSES[w.cause] || w.cause)}</td><td>${hm(w.start)}</td><td class="num">${hours((w.end - w.start) / 1000)}${w.open ? ' (open)' : ''}</td></tr>`).join('');
  const repo = live.repo || SNAP.repo;
  return `<h3>${esc(d.title)}</h3>
    <dl class="kv"><dt>Id</dt><dd>${esc(d.id)}</dd><dt>State</dt><dd>${esc(c.stage)}${c.blocked ? ' · blocked: ' + esc(c.blocked) : ''} · round ${c.round ?? 0} · attempts ${c.attempts ?? 0} · crashes ${c.crashes ?? 0}</dd>
    ${c.pull_request ? `<dt>Pull request</dt><dd><a href="https://github.com/${esc(repo)}/pull/${c.pull_request}" target="_blank" rel="noopener">#${c.pull_request}</a></dd>` : ''}
    <dt>Agent cost</dt><dd>${usd(d.cost)} over ${d.costs.length} runs, ${mins(d.agentSeconds)} agent minutes</dd>
    <dt>The human</dt><dd>${d.questions} question${d.questions === 1 ? '' : 's'} · ${hours(d.humanSeconds)} waited</dd><dt>Send-backs</dt><dd>${d.sendBacks}</dd>
    ${d.marks.length ? `<dt>Stalls, crashes</dt><dd>${d.marks.map(m => esc(m.kind + ' at ' + m.stage + (m.reason ? ' (' + m.reason + ')' : ''))).join(', ')}</dd>` : ''}</dl>
    ${waits ? `<div class="part"><h4>Waits for the human</h4><div class="tablewrap"><table class="runs"><tr><th>Stage</th><th>Cause</th><th>From</th><th class="num">Waited</th></tr>${waits}</table></div></div>` : ''}
    <div class="part"><h4>The journal, by stage visit</h4>${groups || '<p class="hint">No records yet.</p>'}</div>
    <div class="part"><h4>The story</h4>${chs.map((ch, i) => `<details class="chap"${i === 0 ? ' open' : ''}><summary>${esc(ch.title)}</summary>${renderText(ch.body)}</details>`).join('')}</div>`;
}

function stagePanel(id) {

function select(kind, id, keepScroll) {
  sel = { kind, id };
  document.querySelectorAll('[aria-current]').forEach(e => e.removeAttribute('aria-current'));
  const mbody = $('mbody');
  mbody.classList.toggle('dim', kind === 'item');
  document.querySelectorAll('.seg,.links path').forEach(e => e.classList.toggle('on', kind === 'item' && e.dataset.item === id));
  const f = M.features[F], d = kind === 'item' && f && f.items.find(x => x.id === id);
  if (kind === 'item' && d) {
    document.querySelector(`.label[data-item="${CSS.escape(id)}"]`)?.setAttribute('aria-current', 'true');
    $('dtitle').textContent = d.acceptance ? 'Acceptance' : 'Story';
    $('detail').innerHTML = itemPanel(d);
    if (!keepScroll) document.querySelector(`.seg[data-item="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });
  } else if (kind === 'stage' && f && id in M.order) {
    document.querySelector(`.stagehead[data-stage="${CSS.escape(id)}"]`)?.setAttribute('aria-current', 'true');
    $('dtitle').textContent = 'Stage'; $('detail').innerHTML = stagePanel(id);
  } else if (kind === 'feature' && f) {
    document.querySelector('.feat-btn')?.setAttribute('aria-current', 'true');
    $('dtitle').textContent = 'Feature'; $('detail').innerHTML = featurePanel();
  } else { sel = { kind: 'factory' }; mbody.classList.remove('dim'); $('dtitle').textContent = 'Factory'; $('detail').innerHTML = factoryPanel(); }
}

function showSource() {
  $('srcpill').textContent = live.files ? 'live' : 'snapshot';
  $('srcpill').classList.toggle('live', !!live.files);
  $('srctext').textContent = live.files ? `${live.repo}@${live.branch} · ${hm(live.at)} UTC` : `${SNAP.repo}@${SNAP.sha.slice(0, 8)} · ${SNAP.taken_at.slice(0, 16).replace('T', ' ')} UTC`;
}
function load(files) { M = buildModel(files, Date.now()); render(); showSource(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-item],[data-stage],[data-feature]');
  if (t?.tagName === 'A') e.preventDefault();
  if (t?.dataset.goto) { F = t.dataset.goto; drawMap(); }
  if (t?.dataset.item) select('item', t.dataset.item);
  else if (t?.dataset.stage) select('stage', t.dataset.stage);
  else if (t?.dataset.feature && t.tagName === 'TR') { F = t.dataset.feature; $('feature').value = F; drawMap(); select('feature'); }
  else if (t?.dataset.feature) select('feature');
  else if (e.target.closest('#mbody')) select('factory');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('seg')) select('item', e.target.dataset.item);
  if (e.key === 'Escape') select('factory');
});
$('feature').addEventListener('change', e => { F = e.target.value; drawMap(); select(sel.kind === 'item' ? 'feature' : sel.kind, sel.id); });
$('liveBtn').addEventListener('click', () => { const f = $('liveForm'); f.hidden = !f.hidden; $('liveBtn').setAttribute('aria-expanded', String(!f.hidden)); });
$('liveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('liveErr'); err.hidden = true;
  Object.assign(live, { repo: $('repo').value.trim(), branch: $('branch').value.trim() || 'main', token: $('token').value.trim(), etag: null, files: null });
  try {
    await readLive();
    load(live.files);
    $('liveForm').hidden = true; $('liveBtn').setAttribute('aria-expanded', 'false');
    clearInterval(live.timer);
    live.timer = setInterval(async () => {
      if (document.hidden) return;
      try { if ((await readLive()) || (await readBranches())) load(live.files); else showSource(); } catch (x) { $('srctext').textContent = x.message; }
    }, 30000);
  } catch (x) {
    live.files = null;
    err.textContent = x instanceof TypeError
      ? 'This copy cannot reach GitHub: a claude.ai artifact may only load scripts from a few CDNs. Save the page and open it from disk to read live.'
      : x.message;
    err.hidden = false;
  }
});
if (!window.jsyaml) document.body.insertAdjacentHTML('afterbegin', '<p class="hint">The YAML reader (js-yaml from cdnjs) did not load; the map needs it.</p>');
else load(SNAP.files);
</script>
