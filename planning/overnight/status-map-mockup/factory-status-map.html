g", "role": "coder", "start": "2026-10-17T13:09:10Z", "end": "2026-10-17T13:11:10Z", "outcome": "question", "turns": 17, "cost": 0.44, "seconds": 116}, {"stage": "doing", "role": "coder", "start": "2026-10-17T13:12:16Z", "end": "2026-10-17T13:12:30Z", "outcome": "tests", "turns": 4, "cost": 0.06, "seconds": 11}, {"stage": "tests", "role": "tester", "start": "2026-10-17T13:12:33Z", "end": "2026-10-17T13:14:08Z", "outcome": "doing", "turns": 5, "cost": 0.11, "seconds": 53}, {"stage": "doing", "role": "coder", "start": "2026-10-17T13:14:11Z", "end": "2026-10-17T13:16:05Z", "outcome": "review", "turns": 6, "cost": 0.11, "seconds": 65}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T13:16:08Z", "end": "2026-10-17T13:16:52Z", "outcome": "docs", "turns": 7, "cost": 0.28, "seconds": 40}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T13:16:55Z", "end": "2026-10-17T13:18:07Z", "outcome": "demo", "turns": 9, "cost": 0.11, "seconds": 27}, {"stage": "demo", "role": "demo", "start": "2026-10-17T13:18:10Z", "end": "2026-10-17T13:18:31Z", "outcome": "accept", "turns": 5, "cost": 0.15, "seconds": 15}], "events": [{"t": "2026-10-17T13:11:17Z", "kind": "question"}, {"t": "2026-10-17T13:12:13Z", "kind": "answer"}, {"t": "2026-10-17T13:20:27Z", "kind": "merged"}, {"t": "2026-10-17T13:20:31Z", "kind": "booked"}], "text": "---\nstage: done\npr: 167\nblocked: null\ncomments_seen: 2\nround: 0\nattempts: 0\n---\n# The disk record at an instance's start\n\n## Assignment (as of log entry 1)\n\nThe human's word (\"Disk space\", the watch at the end of every major change) is that disk use must not grow without bound: the free space and the size of the work directory, the state directory and the container's `/tmp` are recorded at the start of a run and at each feature acceptance, and compared with the last record. Until now the session wrote these numbers into the night log by hand. This story makes the factory write one disk record when an instance starts: a JSON line in `records/disk.jsonl` in the state directory (through the record file interface of F0012-S0013) and one line in the factory log. F0012-S0017 writes one at each feature acceptance and tells the acceptance reviewer. The host's own numbers (its free space, Docker's disk image) cannot be seen from the container and stay with the session (FEATURE, out of scope). `last` has no caller in `src/factory` until F0012-S0017, so the duplicates record after the coder lists it as new dead code until then; that is expected, not a finding. Two expectations of earlier tests gain the temporary directory by the human's leave (FEATURE decision 46).\n\n## Interface\n\n`src/factory/domain/disk.py` (of F0012-S0009) gains:\n\n```python\nDiskOccasion = Literal[\"start\", \"acceptance\"]\n\n\nclass DiskUse(BaseModel):\n    \"\"\"One folder: its path, the bytes free on its file system and the bytes under it; None is unknown.\"\"\"\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    path: str\n    free_bytes: NonNegativeInt | None\n    used_bytes: NonNegativeInt | None\n\n\nclass DiskRecord(BaseModel):\n    \"\"\"The folders' use at one moment, and why it was taken.\"\"\"\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    at: UtcDatetime\n    occasion: DiskOccasion\n    folders: list[DiskUse]\n\n\ndef disk_line(record: DiskRecord) -> str:\n    \"\"\"`disk <occasion>: <path> <free> free, <used> used; ...`, each value in GB or `unknown`.\"\"\"\n```\n\nEach folder is `<path> <free> free, <used> used`, each value written `<gigabytes(n)> GB`, or `unknown` when it is `None` (`/tmp unknown free, 4.3 GB used`); the folders are joined by `; ` after `disk <occasion>: `.\n\n`src/factory/domain/settings.py`: `InstanceSettings` gains `temporary_directory: Path | None = None`, the last field. `read_settings` does not set it.\n\n`src/factory/application/boundaries.py`: `Boundaries` gains a last, optional field `disk_records: RecordLog[DiskRecord] | None = None`.\n\n`src/factory/application/disk_records.py` (new):\n\n```python\nclass DiskRecorder:\n    \"\"\"Measures the instance's folders and keeps the measure in the records and the factory log.\"\"\"\n\n    def __init__(self, boundaries: Boundaries) -> None: ...\n\n    def record(self, occasion: DiskOccasion) -> DiskRecord | None:\n        \"\"\"Measure, append and log one record; None when the boundaries have no disk, records or settings.\"\"\"\n\n    def last(self) -> DiskRecord | None:\n        \"\"\"The latest record in the records, whatever its occasion; None without one or without a record log.\"\"\"\n```\n\n- The folders, in this order: `settings.checkout.parent`, `settings.state_directory`, and `settings.temporary_directory` when it is set. For each, `disk.free_bytes` and `disk.used_bytes`; an `OSError` of either leaves that value `None`.\n- `at` is `clock.now()`. The record is appended to `disk_records` and `disk_line(record)` is written as one factory log line. An `OSError` of the append writes the log line `cannot write the disk record: <error>` after the record's own line, and `record` still returns the record.\n\n`src/factory/entry/wiring.py`: `build_boundaries` sets `disk_records=JsonLinesRecordLog(<state directory>/records/disk.jsonl, DiskRecord)`; `read_environment_settings` sets `temporary_directory` to `Path(tempfile.gettempdir())`.\n\n`src/factory/entry/run.py`: `run_instance` calls `DiskRecorder(boundaries).record(\"start\")` once, after it builds the boundaries and before the scheduler runs.\n\nTests: `tests/domain/test_disk_records.py` (criteria 1 and 2); `tests/application/test_disk_recorder.py` (criteria 3 to 8), with `FakeDiskSpace` of `tests/disk_support.py` (F0012-S0010), a `JsonLinesRecordLog` in `tmp_path`, `UnwritableRecordLog` of `tests/record_support.py` (F0012-S0013) for criterion 6, and the boundaries of `tests/conftest.py` given `disk`, `disk_records` and `settings` by `dataclasses.replace`; criteria 9 and 10 as new test functions in `tests/entry/test_run.py`, with its `settings` and `environment` fixtures and, for criterion 9, a `should_stop` that is true at once. By the human's leave (FEATURE decision 46), and no other change to an earlier story's test: the expected settings of `test_boundaries_from_environment_reads_the_settings_and_builds_their_boundaries` (`tests/entry/test_wiring_run.py`) and of `test_main_runs_a_valid_environment_once_and_returns_zero` (`tests/entry/test_run.py`) gain `temporary_directory=Path(tempfile.gettempdir())`.\n\n## Acceptance criteria\n\n1. `disk_line` of a record at `start` with `/work` (812_345_678_901 free, 700_000_000 used) and `/state` (`None` free, 1_000 used) is `disk start: /work 812.3 GB free, 0.7 GB used; /state unknown free, 0.0 GB used`.\n2. A `DiskRecord` with an occasion outside `start` and `acceptance`, an `at` without an offset, or a folder with `free_bytes=-1` or `used_bytes=-1`, is refused with `pydantic.ValidationError`; a folder with both values `None`, and one with both values `0`, is accepted. Rows of one parametrized test.\n3. `DiskRecorder.record(\"start\")` with a fake disk returns a record of the checkout's parent and the state directory, in that order, with the fake's values and `at` equal to the clock's reading; the record log then holds exactly that record, and the factory log gains one line that ends with `disk_line` of it.\n4. With `temporary_directory` set, a third folder is that directory; without it, there are two. Rows of one parametrized test.\n5. A fake disk whose `free_bytes` raises `OSError` for the state directory records `free_bytes=None` for it and its `used_bytes` as given; one whose `used_bytes` raises for it records `used_bytes=None` and its `free_bytes` as given. Rows of one parametrized test.\n6. A record log whose `append` raises `OSError(\"disk full\")` gives two factory log lines, the record's and `cannot write the disk record: disk full`, and `record` returns the record.\n7. Boundaries without `disk`, without `disk_records` or without `settings` make `record` return `None`, append nothing and write no line. Rows of one parametrized test.\n8. `last()` gives the latest record of the log, whatever its occasion (an `acceptance` record after a `start` record, and a `start` record after an `acceptance` record); with an empty log, and on boundaries without `disk_records`, it is `None` and reads nothing. Rows of one parametrized test.\n9. `run_instance` with the settings of `tests/entry/test_run.py` and a `should_stop` that is true at once appends exactly one `start` record to `<state directory>/records/disk.jsonl` and clones nothing.\n10. `read_environment_settings` of a valid environment gives `temporary_directory == Path(tempfile.gettempdir())`, and `read_settings` of the same environment gives `temporary_directory is None`. Two rows of one parametrized test.\n11. `make check` stays green.\n12. docs: the operator guide's part *The records* (F0012-S0013) names `records/disk.jsonl`, its line in the factory log, when it is written (at each start of the instance; at each acceptance, F0012-S0017), that the size of a folder counts only what the factory user can read (the agent's own folders under `/tmp`, made by pytest or Claude Code with mode `0700`, are left out, while the free space of the file system still shows them), and that the host's own numbers (free space of the drive, the size of Docker's disk image, `docker system df`) are read on the host by hand at the same moments and at the end of a run; the project guide names `DiskRecorder`, `DiskRecord` and `disk_line`; the decision log records why the record is not committed and why no record is written at the end of a run (the last acceptance is near it, and the host's numbers are read by hand). No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run python -c \"\nfrom datetime import UTC, datetime\nfrom factory.domain.disk import DiskRecord, DiskUse, disk_line\nrecord = DiskRecord(at=datetime(2026, 10, 17, tzinfo=UTC), occasion='start', folders=[DiskUse(path='/work', free_bytes=812_345_678_901, used_bytes=700_000_000), DiskUse(path='/tmp', free_bytes=None, used_bytes=4_300_000_000)])\nprint(disk_line(record))\n\"\n```\nExpect: `disk start: /work 812.3 GB free, 0.7 GB used; /tmp unknown free, 4.3 GB used`.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/domain/test_disk_records.py tests/application/test_disk_recorder.py tests/entry/test_run.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names concrete modules and signatures (`domain/disk.py` DiskUse/DiskRecord/disk_line, `InstanceSettings.temporary_directory`, `Boundaries.disk_records`, new `application/disk_records.py` DiskRecorder, wiring and run_instance). The helpers it relies on exist: `gigabytes` in `domain/disk.py`, `FakeDiskSpace`, `UnwritableRecordLog`, `RecordLog`, `JsonLinesRecordLog`.\n   - Criteria: each is testable by one test function. The disk_line format and its unknown case (1), the validation rows (2), the folder order and fake values (3), the temporary-directory row (4), OSError on either value (5), the append failure (6), the missing-boundary rows (7), `last` (8), `run_instance` (9) and the settings (10) each have one. Every Interface rule has a criterion for its failing side: the invalid occasion, naive `at` and -1 values (2), the absent temporary directory (4), the OSError cases (5, 6), the missing boundaries (7), the empty log (8).\n   - Demo: both commands are runnable. Each `Expect:` line can be checked against the output; the first is the exact line, the second is the pytest summary.\n   - Architecture: the domain model is pure. The recorder sits in application behind `Boundaries`. The concrete JsonLinesRecordLog and `tempfile.gettempdir()` are wired only in entry. This matches the fou ) -> list[str]:\n    \"\"\"The findings of every demo under `root / \"demo\"`, one line each, in path order.\"\"\"\n\ndef main(argv: Sequence[str] | None = None) -> int:\n    \"\"\"Print `demos ok` and return 0, or print one line per finding and return 1.\"\"\"\n```\n\n`main` takes `--root <path>` (default: the current directory) and passes `argv` to `argparse` as given. `check_demos` finds, in this order:\n\n- No `demo/` folder under `root`: no finding.\n- `demo/` without a file `README.md`: `demo/README.md: missing`.\n- Every folder `demo/<name>/` (files directly under `demo/` other than `README.md`, and folders whose name starts with `.`, are skipped), in name order:\n  - `demo/README.md` has no line that holds `` `<name>/` ``: `demo/README.md: names no demo '<name>'`.\n  - each of `README.md` (a file), `project/` and `features/` (folders) that is missing: `demo/<name>: missing <part>` (`missing README.md`, `missing project/`, `missing features/`). Without `project/`, nothing under it and no story is checked; without `features/`, no story is checked.\n  - `project/factory/pipeline.yml` missing: `demo/<name>: missing project/factory/pipeline.yml`; present but refused by `RuamelPipelineDefinitionReader().parse`: `demo/<name>/project/factory/pipeline.yml: <the fault>`.\n  - `project/factory/story-form.md` missing: `demo/<name>: missing project/factory/story-form.md` (then no story is checked).\n  - every file under `features/`, in path order: it must be `features/<feature>/feature.md` or `features/<feature>/backlog/<story>.md`; any other file gives `demo/<name>/features/<rest>: not a feature file or a backlog story`. A backlog story is checked as the factory checks it on `main`: `check_story_place(\"factory/features/<feature>/backlog/<story>.md\", feature_file_exists=<features/<feature>/feature.md exists>)`, then its text read with `FrontmatterWorkItemReader().parse_specification` and `check_story_form(<document>, <the story form>, folder=\"backlog\")`; a `WorkItemFormatError` of the reader is one finding with its fault. Each finding is `demo/<name>/features/<rest>: <message>`, or `demo/<name>/features/<rest>:<line>: <message>` when the finding has a line.\n\nThe story part is the story check's own: `factory.entry.check_story` gains `backlog_story_findings(reader: WorkItemReader, path: str, text: str, form: str, *, feature_file_exists: bool) -> list[FormFinding]`, the place findings of `path` and then the form findings of `text` read as a specification (a `WorkItemFormatError` of the reader is one finding with its fault), and `finding_line(path: str, finding: FormFinding) -> str`, `<path>: <message>` or `<path>:<line>: <message>`. `factory-check-story` uses both for a backlog story and `check_demos` for every demo story; the reader is `build_work_item_reader()` of `factory.entry.wiring`. The tests of `tests/entry/test_check_story.py` still pass unchanged.\n\nTests: `tests/entry/test_check_demos.py` (criteria 1 to 13, with demos written into `tmp_path`, the pipeline definition `PIPELINE_YAML` and the form `STORY_FORM` of `tests/git_support.py`, and story texts that pass that form); `tests/test_demos.py` (criterion 14), which runs `main([\"--root\", <the repository root>])` and expects 0, so `make check` checks every demo.\n\n## Acceptance criteria\n\n1. A root without `demo/` gives no finding, and `main` prints `demos ok` and returns 0.\n2. A complete demo `todo` (its `README.md`; `project/factory/pipeline.yml` = `PIPELINE_YAML`; `project/factory/story-form.md` = `STORY_FORM`; `features/F0001-x/feature.md`; one valid backlog story `features/F0001-x/backlog/F0001-S0001-first.md`) with an index that holds `` `todo/` `` gives no finding.\n3. Without the index file: `demo/README.md: missing`; with an index that does not name the demo: `demo/README.md: names no demo 'todo'`.\n4. A demo without its `README.md`, without `project/` or without `features/` gives exactly the one finding `demo/todo: missing README.md`, `demo/todo: missing ry has no `demo/` folder yet (`ls demo` reports that it does not exist). So command 1 is criterion 1 run on the real root: no finding, `demos ok`, exit 0. It is also criterion 14: the `--root` default is the current directory, and the root is the repository root. This fits the Assignment (\"Until step 2 there is no demo, and the check passes\"). Command 2 runs the tests for criteria 1–14, and all of them pass. The demo contradicts no criterion. I did not run `make check` (criterion 15) or `make documents` (part of criterion 16); the factory runs `make check` itself, and entry 14 reports both green.\n\n    Open, from earlier entries and not a demo finding: in entry 12 the human deferred reusing `work_item_path` in `src/factory/entry/check_demos.py` to a later fix.\n16. done (pull request merged); cost: 13 runs, 11.8 min, 88 turns, 344k tokens in (1388k more from cache), 42k out, $2.59\n", "title": "The demo check", "pr": 173, "state": "done", "cost": 2.58}, {"id": "F0012-S0024-the-kill-of-an-agent-run-under-sudo", "segments": [{"stage": "ready", "role": "intake", "start": "2026-10-17T15:06:03Z", "end": "2026-10-17T15:06:21Z", "outcome": "tests", "turns": 4, "cost": 0.09, "seconds": 11}, {"stage": "tests", "role": "tester", "start": "2026-10-17T15:06:24Z", "end": "2026-10-17T15:09:32Z", "outcome": "doing", "turns": 8, "cost": 0.42, "seconds": 156}, {"stage": "doing", "role": "coder", "start": "2026-10-17T15:09:35Z", "end": "2026-10-17T15:11:59Z", "outcome": "review", "turns": 8, "cost": 0.26, "seconds": 103}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T15:12:02Z", "end": "2026-10-17T15:12:48Z", "outcome": "docs", "turns": 5, "cost": 0.22, "seconds": 42}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T15:12:51Z", "end": "2026-10-17T15:14:00Z", "outcome": "demo", "turns": 6, "cost": 0.12, "seconds": 29}, {"stage": "demo", "role": "demo", "start": "2026-10-17T15:14:03Z", "end": "2026-10-17T15:14:32Z", "outcome": "accept", "turns": 4, "cost": 0.13, "seconds": 22}], "events": [{"t": "2026-10-17T15:24:36Z", "kind": "merged"}, {"t": "2026-10-17T15:24:40Z", "kind": "booked"}], "text": "---\nstage: done\npr: 174\nblocked: null\ncomments_seen: 0\nround: 0\nattempts: 0\n---\n# The kill of an agent run under sudo at its time limit\n\n## Assignment (as of log entry 1)\n\n`run_process` kills the process group of a call at its time limit. When the agent runs as another user, the group's leader is `sudo`, owned by root, which the factory's user may not signal: the kill fails with `PermissionError`, the run becomes an `AgentRuntimeError`, and the `claude` process under `agent` runs on (F0010 decision 30, open until now). The human's answer of 2026-10-17 (item 1.8): `timeout --signal=KILL <limit>` inside the `sudo` call, so that the agent's own user kills its own process tree at the limit; the end read as `time_limit`; and a grace time on the outer call, so that the factory's own kill fires only when the inner one did not. This story builds it in `ClaudeCodeRuntime` (FEATURE decision 27). A call without an operating-system user does not change. It is observed for real at the first start (step 3). One test of F0010-S0014 that pins the head of the `sudo` call changes by the human's leave (FEATURE decision 41).\n\n## Interface\n\n`src/factory/adapters/claude_runtime.py`:\n\n- `TIMEOUT_EXECUTABLE = \"timeout\"` and `SUDO_GRACE = timedelta(seconds=30)`.\n- A request with an `os_user` is started as `[<sudo>, \"-n\", \"-u\", <user>, \"--\", \"timeout\", \"--signal=KILL\", \"<seconds>s\", \"env\", \"-i\", <assignments>..., <claude>, <arguments>...]`, where `<seconds>` is the call's time limit in whole seconds rounded up (`30` for 30 s, `2` for 1.5 s). The outer `ProcessRequest`'s `time_limit` is the call's time limit plus `SUDO_GRACE`.\n- A call with an `os_user` whose process ended with exit status `137` or `-9` (killed by `SIGKILL`, as `subprocess` reports a signal) after a duration of at least its time limit is a call ended by its time limit: its end reason is `time_limit` and it has no measures (no decision, entry, turns, tokens, cost or model time), exactly as a call the factory's own kill ended. The same exit status before the time limit is not; it is `died`, as today.\n- The rule for a `sudo:` line (an `AgentRuntimeError` when the call ended without a usable reply and `sudo` printed a line starting `sudo:`) treats an inner kill like an outer one: a `sudo:` line then stops the run with that error.\n- The resume of a budget stop goes through the same call, with what is left of the time limit as its limit.\n- A request without an `os_user` is started and limited as today.\n\nTests: `tests/adapters/test_claude_runtime_sudo_time_limit.py`, with the `sudo` stand-in of `tests/adapters/test_claude_runtime_os_user.py` (its script and helpers may be imported from there), the `claude` stand-in of `tests/adapters/claude_stand_in.py`, and the real `timeout` of coreutils (criteria 1, 2 and 4); for criteria 3, 5 and 6, `run_process` of `factory.adapters.claude_runtime` replaced through pytest's `monkeypatch` by a recorder that keeps each `ProcessRequest` and returns the `ProcessResult` the test gives, as `tests/adapters/test_git_cli_arguments.py` replaces `check_git_argument`. By the human's leave (FEATURE decision 41), and no other change to an earlier story's test: the expected head of the call in `test_with_a_user_sudo_gets_the_user_env_i_the_environment_and_the_executable` becomes `[\"-n\", \"-u\", \"agent\", \"--\", \"timeout\", \"--signal=KILL\", \"30s\", \"env\", \"-i\"]`, with the assignments and the executable after it.\n\n## Acceptance criteria\n\n1. With an `os_user` and a time limit of 30 s, the `sudo` stand-in receives `-n -u agent -- timeout --signal=KILL 30s env -i`, then the assignments, then the `claude` executable; with a time limit of 1.5 s the limit argument is `2s`. Rows of one parametrized test.\n2. With an `os_user`, a `claude` stand-in that prints a reply and then waits 60 s under a time limit of 1 s ends with `end_reason == \"time_limit\"`, no decision, no entry and no measures, and the call took less than the 31 s of the outer limit.\n3. With the recorder returning the module's reply on standard output and a time limit of 30 s: with an `os_user`, exit status `137` or `-9` after a duration of 30 s is `time_limit` with no decision, entry or measure; `137` or `-9` after 29.9 s is `died`; exit status `1` after 30 s is `died`; without an `os_user`, `137` after 30 s is `died`. Rows of one parametrized test.\n4. With an `os_user`, a `sudo` stand-in that prints `sudo: unable to resolve host x` before the inner kill at the limit raises `AgentRuntimeError` whose detail holds that line (the existing test still passes).\n5. With the recorder and a time limit of 30 s, the process request has a time limit of 60 s (30 s and `SUDO_GRACE`) with an `os_user`, and of 30 s without one, whose arguments then hold no `timeout`. Rows of one parametrized test.\n6. With an `os_user` and the recorder answering the first call with a budget-stop reply (`subtype` `error_max_budget_usd`) at once, the resume's arguments hold `timeout --signal=KILL 30s` (what is left of 30 s, rounded up) and its process request's time limit is more than 59 s and at most 60 s.\n7. Every other test of `tests/adapters/test_claude_runtime_os_user.py`, `tests/adapters/test_claude_runtime.py` and `tests/adapters/test_claude_runtime_resume.py` still passes.\n8. `make check` stays green.\n9. docs: the operator guide's section *The agent runs as a second user* replaces the paragraph that says a `time_limit` under `sudo` is not solved: the runtime puts `timeout --signal=KILL <limit>s` inside the `sudo` call, reads status 137 (or a death by `SIGKILL`) after the limit as `time_limit`, and kills the call itself only after 30 more seconds; the morning observation of a `time_limit` under `sudo` says what to see (no `claude` process of `agent` left after the limit); the decision log records the human's answer to F0010 decision 30 and why the inner kill is the agent's own; the project guide's description of the `claude -p` runtime names the call's new form. No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/adapters/test_claude_runtime_sudo_time_limit.py tests/adapters/test_claude_runtime_os_user.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n```bash\ngrep -n \"TIMEOUT_EXECUTABLE = \\|SUDO_GRACE = \" src/factory/adapters/claude_runtime.py\n```\nExpect: two lines, `TIMEOUT_EXECUTABLE = \"timeout\"` and `SUDO_GRACE = timedelta(seconds=30)`, each after its line number.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted.\n   - Interface: names concrete module `src/factory/adapters/claude_runtime.py`, both constants with values, the exact argument vector of the `sudo` call, the rounding rule, the outer limit, the exit statuses (137, -9) and the resume. The test files and stand-ins it names are the ones in the repository's test conventions.\n   - Criteria: each is testable by one parametrized or single test function. Every behaviour in the Interface has a criterion: the argument vector and rounding (1), the end reason and no measures (2, 3), the `sudo:` line (4), the outer limit and the call without a user (5), the resume (6). The failing sides are covered: 137 or -9 before the limit is `died`, status 1 after the limit is `died`, and 137 without an `os_user` is `died` (3). The one earlier test that changes is named, with FEATURE decision 41 as the leave (7).\n   - Demo: both commands are runnable. The `Expect:` lines are checkable: the pytest summary line has no failed, error or skipped count, and the grep prints two exact lines.\n   - Architecture: the change sits wholly in `factory.adapters.claude_runtime`, the agent-runtime wrapper, and uses the existing `run_process` and `ProcessRequest`. No other layer is touched.\n   - Scope: within F0012 item 1.8, which is S0024's own scope. Nothing in \"Out of scope\" is touched.\n3. tester: Wrote the tests for criteria 1 to 7. The red tests are the coder's specification.\n\n   Which criterion maps to which test:\n   - criterion 1: tests/adapters/test_claude_runtime_sudo_time_limit.py::test_with_a_user_sudo_runs_the_agent_under_timeout_with_the_limit_rounded_up (rows `whole` 30 s → `30s`, `rounded-up` 1.5 s → `2s`). It uses the real `sudo` stand-in, the real `claude` stand-in and coreutils `timeout`.\n   - criterion 2: …::test_with_a_user_the_inner_kill_at_the_limit_is_a_time_limit_without_measures. The `claude` stand-in prints a reply and then waits 60 s; the time limit is 1 s. Expected: `time_limit`, no decision, entry, turns, tokens, cost or model time, and the call ends in under 31 s.\n   - criterion 3: …::test_a_kill_status_at_the_limit_under_sudo_is_a_time_limit_and_otherwise_a_death. Six rows: 137 or -9 at 30 s is `time_limit` with no measures; 137 or -9 at 29.9 s is `died`; status 1 at 30 s is `died`; 137 at 30 s without an `os_user` is `died`. It uses the `recorder` fixture, which puts a recorder in place of `claude_runtime.run_process` through monkeypatch.\n   - criterion 4: …::test_a_sudo_line_before_the_inner_kill_is_a_runtime_error. The `sudo` stand-in prints `sudo: unable to resolve host x`; the time limit is 1 s. Expected: `AgentRuntimeError` whose detail holds that line.\n   - criterion 5: …::test_the_outer_limit_adds_the_grace_only_under_sudo. Rows: with a user the outer limit is 60 s; without one it is 30 s and the arguments hold no `timeout`.\n   - criterion 6: …::test_the_resume_under_sudo_is_limited_by_what_is_left_of_the_time_limit. The first call returns a budget-stop reply. Expected for the resume: `timeout --signal=KILL 30s` in its arguments, and a time limit above 59 s and at most 60 s.\n   - criterion 7: the existing tests stay as they are. By gents/` to `0755`, every file in it to `0644`, and `settings.json` to `0644`; it changes the mode of nothing else in the home. Nothing else changes: the umask, the replaced copy of `agents/`, the runs folder, the log lines (`installed agents and settings into <home>` among them) and the start of the instance stay.\n\nTests: `tests/test_agent_home_ownership.py`, reading the Dockerfile with `_path_settings` of `tests/test_image.py` (or `dockerfile_instructions` of `tests/dockerfile_support.py`) and running the entrypoint as `tests/test_entrypoint.py` does (its `Layout` may be imported). By the human's leave (FEATURE decision 42), and no other change to an earlier story's test: the row `/home/agent/.claude` is removed from `test_the_shared_directories_are_writable_by_the_work_group` in `tests/test_image.py`, whose row `/work` stays.\n\n## Acceptance criteria\n\n1. The Dockerfile's last `chown` of `/home/agent/.claude` is `factory:factory-work` and its last `chmod` is `3775`; `/work` keeps `2775` and the group `factory-work`.\n2. After the entrypoint runs, `<home>/agents` has mode `0755`, each agent file in it `0644`, and `<home>/settings.json` `0644`; none of them is writable by the group or by others.\n3. The files' contents are still the image's (the existing tests of `tests/test_entrypoint.py` still pass), and the entrypoint still sets its umask `002` before anything else (the existing test of `tests/test_entrypoint_umask.py`).\n4. A file the agent made in the home before (a stand-in `.credentials.json` with mode `0600`) is neither removed nor changed by the entrypoint.\n5. `make check` stays green.\n6. docs: the operator guide's section *Users and directories* gives `/home/agent/.claude` its own row (`3775`, owner `factory`, group `factory-work`: the agent adds its own files, it cannot change or remove the agents and the settings), and the sentence that the agent could change the files in its home (*The agent runs as a second user*) says what is protected now, that the login stays the agent's, and what stays writable (files of its own in `~/.claude` that `claude` reads, such as a user `CLAUDE.md` or skills, and `/home/agent/.claude.json`); it says that a `claude-home` volume made by an earlier image keeps its old owner and mode, so the protection holds on a new volume; the morning observations get one line to check it (`docker exec -u agent <container> sh -c 'echo x >> /home/agent/.claude/settings.json'` is refused); the decision log records that F0010 decision 21 is superseded for the agent files and the settings, and what stays open. No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\ngrep -n \"/home/agent/.claude\" image/Dockerfile\ngrep -n \"chmod\" image/entrypoint.sh\n```\nExpect: the Dockerfile lines name `chown factory:factory-work` and `chmod 3775` for `/home/agent/.claude`; the entrypoint lines set `0755` for the agents folder and `0644` for the agent files and `settings.json`.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/test_agent_home_ownership.py tests/test_image.py tests/test_entrypoint.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names concrete files and values. `image/Dockerfile` has the `chown factory:factory-work` and `chmod 3775` for `/home/agent/.claude`, and `/work` stays `2775`. `image/entrypoint.sh` has the modes `0755` for `agents/` and `0644` for each agent file and `settings.json`. The new test module `tests/test_agent_home_ownership.py` names the helpers it reuses (`_path_settings`, `dockerfile_instructions`, `Layout`). The removed row of `tests/test_image.py` is named and covered by FEATURE decision 42.\n   - Criteria: each can be tested by one test function. 1 is the Dockerfile's last chown and chmod. 2 is the modes after the entrypoint runs, including not writable by group or others. 3 is the existing entrypoint and umask tests. 4 is a stand-in `.credentials.json` at `0600` that is unchanged. Every Interface rule has a criterion. The \"changes the mode of nothing else in the home\" rule is covered by 4, and the failing side of the modes by 2's \"none writable by group or others\". The sticky bit's effect on rename and delete is not a criterion. It is the Dockerfile's `3775` read by 1 and cannot be run without a container.\n   - Demo: the `grep` commands and the pytest command are runnable. Each `Expect:` line is checkable against the output: the named `chown`, `chmod 3775` and `0755`/`0644` lines, and a final `<n> passed` line with no failed, error or skipped count.\n   - Architecture: the change stays in `image/`, inside the coder's write paths, and adds no new dependency. The docs criterion touches only the operator guide and the decision log.\n   - Scope: this is item 1.10 of FEATURE.md, listed as S0025 and decided in decisions 13, 28, 42 and 47. It is not in \"Out of scope\". The other writable files in the home stay open, as decision 47 says.\n3. tester: wrote the red tests for the agent home's ownership and modes.\n   - criterion 1: tests/test_agent_home_ownership.py::test_the_agent_home_is_the_factorys_with_the_sticky_bit_and_work_stays_shared. It has two rows. In `agent-home`, `/home/agent/.claude` has `3775` and `factory:factory-work`. In `work`, `/work` has `2775` and group `factory-work`. Both read the last values through `_path_settings` of tests/test_image.py.\n   - criterion 2: tests/test_agent_home_ownership.py::test_the_installed_agents_and_settings_are_not_writable_by_group_or_others. The rows are `agents` 0755, `agents/coder.md` 0644, `agents/reviewer.md` 0644 and `settings.json` 0644. Each row also checks that the group and others have no write bit. The test runs the entrypoint with `Layout` from tests/test_entrypoint.py. It makes the image's copies group-writable first (dir 0775, files 0664), a mod 3775`. `/work` keeps `factory:factory-work` and `chmod 2775`. Nothing else in that `RUN` changed.\n   - `image/entrypoint.sh`: after the two `cp` commands it runs `chmod 0755 \"$home/agents\"`, `find \"$home/agents\" -type f -exec chmod 0644 {} +` and `chmod 0644 \"$home/settings.json\"`, with one comment saying why. The umask, the replaced copy, the log lines and the start of the instance are unchanged. Nothing else in the home is touched, so the agent's `.credentials.json` keeps its mode (criterion 4).\n   - Design decision: I used `find -type f` rather than `chmod 0644 \"$home/agents\"/*`. A glob fails on an empty folder and skips dotfiles. I rejected `chmod -R u=rwX,go=rX` because it keeps an exec bit and does not give the exact `0644` the Interface asks for. One limit: a subfolder inside `agents/` would keep its copied mode. The image's agents folder has no subfolders today.\n   - Refactor: I read the diff and found nothing to change. No separate refactor commit.\n   - Noticed, not touched: the entrypoint's header comment says the umask lets \"either remove the other's\" files. That is still true in `/work`, but no longer for the factory's files in the home. The docs criterion (6) covers the operator guide and decision log for this story. The documenter may want to check whether that comment's wording matters.\n   - `make check`: check: green.\n\n   `make check`: check: green\n   `make duplicates`: duplicates: 0 new, 39 known, 0 gone\n5. reviewer: no findings.\n   - Criteria: criterion 1 is covered by `tests/test_agent_home_ownership.py::test_the_agent_home_is_the_factorys_with_the_sticky_bit_and_work_stays_shared`. Its rows check `/home/agent/.claude` (`3775`, `factory:factory-work`) and `/work` (`2775`, group `factory-work`), both read as the last value through `_path_settings`. Criterion 2 is covered by `test_the_installed_agents_and_settings_are_not_writable_by_group_or_others`. Before the entrypoint runs, the test makes the source copies group-writable ome/settings.json\"\n   33:chmod 2750 \"$state/runs\"\n   ```\n   Met. The Dockerfile has `chown factory:factory-work` and `chmod 3775` for `/home/agent/.claude`. The entrypoint sets `0755` on `agents/` and `0644` on the agent files and on `settings.json`. Line 33 (`/state/runs`) was already there before this story.\n\n   Command 2:\n   ```\n   $ uv run pytest --no-header -p no:cacheprovider tests/test_agent_home_ownership.py tests/test_image.py tests/test_entrypoint.py\n   ........................................................................ [ 93%]\n   .....                                                                    [100%]\n   77 passed in 0.20s\n   ```\n   Met. The last line is `77 passed`, with no failed, error or skipped count.\n\n   Criteria cross-check:\n   - 1: `image/Dockerfile:23,27` keeps `/work` at `factory:factory-work` and `2775`, as required.\n   - 2: the entrypoint changes only the agents folder and `settings.json`, so nothing else in the home is touched (criteria 2 and 4).\n   - 3: covered by the existing entrypoint tests, which pass in the run above.\n   - 6: `uv run python -m factory.entry.check_documents` prints `documents ok`. The diff against `origin/main` changes only `docs/operator-guide.md` and `docs/decisions.md`, with the row, the rewritten sentence, the note about old volumes, the morning-observation line and the decision entry.\n   - 5: I did not run `make check` myself. The factory runs it as the gate.\n\n   Findings: none.\n   Open: the sticky bit's effect and the morning-observation command need a container. Neither was run here (already noted at intake and by the documenter).\n8. done (pull request merged); cost: 6 runs, 4.5 min, 39 turns, 166k tokens in (491k more from cache), 15k out, $1.02\n", "title": "The agent cannot rewrite its agents and settings", "pr": 175, "state": "done", "cost": 1.02}, {"id": "F0012-S0026-a-missing-health-file-reads-as-not-healthy", "segments": [{"stage": "ready", "role": "intake", "start": "20 ile as not healthy (FEATURE decision 29). A damaged file still reads as healthy: every stop is raised again while its fault lasts. Two tests of F0010 change by the human's leave (FEATURE decision 43).\n\n## Interface\n\n`src/factory/entry/wiring.py`: `health_file(state_directory: Path) -> Path`, the path of the health file in `state_directory` (`<state_directory>/health.json`), used by `health_store` and by the two commands below.\n\n`src/factory/entry/run.py`: `run_instance` first writes `HealthStatus()` through `health_store(settings.state_directory)` when `health_file(settings.state_directory)` does not exist, before it reads the token file; an existing file is left as it is, its stops in force. An `OSError` of that write propagates.\n\n`src/factory/entry/health.py`, `main`: without a given `store`, when `health_file(<state directory>)` does not exist, it prints `no health status: <path> is missing` and returns 1. With a given `store`, it reads the store as today. Everything else is unchanged.\n\nTests: `tests/entry/test_health_missing.py` and `tests/entry/test_run_health_file.py` (with the settings and fakes `tests/entry/test_run.py` uses). By the human's leave (FEATURE decision 43), and no other change to an earlier story's test: `test_a_state_directory_without_a_health_file_is_healthy` in `tests/entry/test_health.py` becomes `test_a_state_directory_without_a_health_file_is_not_healthy`, with the line and status of criterion 1, and the row without stops of `test_the_module_run_as_a_process_exits_with_the_health_status` writes an empty health status first.\n\n## Acceptance criteria\n\n1. `main([\"--state-directory\", <a folder without health.json>])` prints `no health status: <folder>/health.json is missing` and returns 1; with a file holding no stop it prints `healthy` and returns 0; with a damaged file (`not json`) it prints `healthy` and returns 0. Rows of one parametrized test.\n2. `main` with a given store and no file in the state directory reads the store: main moves\n\n## Assignment (as of log entry 1)\n\nThe preflight probes `main` with `lint` only after the machine's items have passed. When they fail (a new image without `make`, say), the preflight stops with `preflight_failed` and returns before the probe, so a `main_branch_failing` raised earlier stays in the health status even after the human has pushed the fix to `main` (F0010's acceptance, open point 5; `docs/decisions.md`, the S0009 entry's \"Open:\"). The human's answer of 2026-10-17 (item 1.10): a standing `main_branch_failing` is cleared when `main` is green again. Whether the new `main` is green cannot be known while the machine cannot run `lint`; what is known is that the stop names a commit that is no longer `main`. This story clears the stop then, and the new `main` is probed as soon as the machine's items pass again, which raises the stop anew if it is red (FEATURE decision 30). A stop whose commit is still `main` stays.\n\n## Interface\n\n`src/factory/application/preflight.py`, `Preflight.run`: when the machine's items fail, before it returns `preflight_failed`, it reads the stamp it started with. When that stamp has a `main_failed` commit and `git.resolve(\"origin/main\")` gives another commit (or `None`), it calls `clear_stop(\"main_branch_failing\")`; when it gives the same commit, or the stamp has no `main_failed`, the stop is left as it is. A `GitError` of the `resolve` leaves the stop as it is and does not change the result. The result is still `preflight_failed`, and the stamp is not rewritten. Nothing else in the preflight changes.\n\nTests: `tests/application/test_preflight_stale_main_stop.py`, with the `rig` and `red_main` fixtures of `tests/application/test_preflight_run.py` (imported or rebuilt the same way): a red `main` probed once (so the stamp holds `main_failed`), then the machine's items made to fail by removing `make` from the rig's `which` and running the preflight with another image. No existing test changes.\n\n## Acceptance criteria\n\n1. After `main` has moved on from the failing commit (the human's fix pushed) or is gone (the preflight's git a clone of an empty remote, as `test_without_an_origin_main_no_lint_runs_and_the_preflight_passes` builds it), a preflight whose machine's items fail returns `preflight_failed`, the health status holds `preflight_failed` and no `main_branch_failing`, the factory log gains `stop cleared main_branch_failing`, and the stamp is as it was. Two rows of one parametrized test.\n2. When `main` has not moved, the same preflight returns `preflight_failed`, the health status holds both stops, `main_branch_failing` with its earlier detail, and the stamp is as it was.\n3. When the stamp has no `main_failed` (a green `main` probed before) and a `main_branch_failing` stands (written into the health status as `Rig.raise_standing` does), the machine's failure returns `preflight_failed` and leaves both stops in force.\n4. When git cannot resolve `origin/main` (the checkout removed, as `test_a_git_error_while_probing_is_a_machine_stop_and_leaves_the_stamp` removes it), the machine's failure leaves `main_branch_failing` in force and the result `preflight_failed`.\n5. When the machine's items pass again on the fixed `main`, the preflight probes it once: green clears nothing more and returns `None`; red raises `main_branch_failing` for the new commit. Two rows of one parametrized test.\n6. Every test of `tests/application/test_preflight_run.py` and `tests/application/test_tick_preflight.py` still passes.\n7. `make check` stays green.\n8. docs: the operator guide's section *The stamp and the probe of the main branch* says that while the machine's items fail, a `main_branch_failing` of a commit that is no longer `main` is cleared, and that the new `main` is probed when the machine passes again; the decision log answers the S0009 entry's open point (the human's answer of 2026-10-17). No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/application/test_preflight_stale_main_stop.py tests/application/test_preflight_run.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names `src/factory/application/preflight.py`, `Preflight.run`, `git.resolve(\"origin/main\")` and `clear_stop(\"main_branch_failing\")`. It states each case: the same commit, a different commit, `None`, no `main_failed` in the stamp, a `GitError`. The result stays `preflight_failed` and the stamp is not rewritten. The `rig`, `red_main` and `Rig.raise_standing` names it cites exist in `tests/application/test_preflight_run.py`, and `preflight.py` already compares `stamp.main_failed` with `main`.\n   - Criteria: each one is a single test, or two parametrized rows (1 and 5). Every behaviour the Interface states has a criterion on the passing side and the failing side: moved or gone is 1, unmoved is 2, no `main_failed` is 3, a git error is 4, and the later probe, green or red, is 5. The pass-through of existing tests is 6, and `make check` and `docs:` come last.\n   - Demo: one runnable pytest command over two named test files. Its `Expect:` line names the last line's form (`<n> passed in <t>s`, with no failed, error or skipped count), which can be checked against the output.\n   - Architecture: the change sits in the application layer and uses only the existing git and stop-clearing interfaces. It adds no dependency and no new module, and the only test file is the new one in `tests/application/`.\n   - Scope: this is item 1.10 of FEATURE.md. It matches FEATURE decision 30, which the human confirmed in decision 47, and nothing in \"Out of scope\" applies.\n3. tester: Wrote the tests for the acceptance criteria in a new file, `tests/application/test_preflight_stale_main_stop.py`. It reuses the `rig` and `red_ma ith `PreToolUse:Write hook error: [factory-guard tester]: guard: no lane configured for 'tester' in factory/stages.yml`. That is a problem in the pipeline's configuration,", "cost": 0.0, "seconds": 0}, {"stage": "tests", "role": "tester", "start": "2026-10-17T16:16:19Z", "end": "2026-10-17T16:20:01Z", "outcome": "doing", "turns": 14, "cost": 0.61, "seconds": 188}, {"stage": "doing", "role": "coder", "start": "2026-10-17T16:20:05Z", "end": "2026-10-17T16:21:58Z", "outcome": "review", "turns": 7, "cost": 0.19, "seconds": 70}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T16:22:01Z", "end": "2026-10-17T16:23:03Z", "outcome": "docs", "turns": 9, "cost": 0.34, "seconds": 58}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T16:23:06Z", "end": "2026-10-17T16:24:08Z", "outcome": "demo", "turns": 8, "cost": 0.15, "seconds": 24}, {"stage": "demo", "role": "demo", "start": "2026-10-17T16:24:11Z", "end": "2026-10-17T16:24:42Z", "outcome": "accept", "turns": 6, "cost": 0.13, "seconds": 25}], "events": [{"t": "2026-10-17T16:26:38Z", "kind": "merged"}, {"t": "2026-10-17T16:26:42Z", "kind": "booked"}], "text": "---\nstage: done\npr: 180\nblocked: null\ncomments_seen: 1\nround: 0\nattempts: 1\n---\n# A Makefile in the template\n\n## Assignment (as of log entry 1)\n\nThe human decided on 2026-10-17 that what v1 learns while it builds v1.1 must also reach what v1.1 ships. `template/` holds a pipeline definition and a `CLAUDE.md` but no `Makefile`, so a new project (first the todo demo, plan step 3) writes its project commands from nothing and misses what F0012 made of `factory-rf`'s own: one shell per recipe, each target's time on its last line (H1, read by S0012), `make test` on every core with a JUnit report (H1), `make secrets` over the changed files only (H1), the duplicates report (H3) and `make mutants` (H5). This story adds `template/Makefile`, a Python example in that pattern: the contract's three targets `check`, `lint` and `test`, the other targets of `check`, and `duplicates` and `mutants`. `documents` is left out: it runs `factory-rf`'s own document check, which a project does not have. `duplicates` writes and counts the findings but compares them with no baseline, because the comparison is `factory-rf`'s own module, which a project does not have either (FEATURE decision 50). `mutants` finds the modules a feature changed by the subjects `work item <feature>-S<nnnn>: ...` of the commits on `origin/main`, which v1.1 writes on every commit of a work item's branch since F0012-S0030; it takes the feature from an acceptance's branch, `work-item/<feature>-A<nnnn>`. The story is built after F0012-S0030 and depends on it (FEATURE decision 51). Where a project decides, the file has placeholders: its package folder and its layers command. Its header names the development dependencies the targets need. `template/CLAUDE.md`'s *Checks* says what the targets do, as `factory-rf`'s `CLAUDE.md` does, and carries the Python row of `planning/lessons-for-the-skills.md` on mutation testing (2026-10-17, H5): mutmut's runs leave out the tests that read the source. The template is in the coder's write paths; the tests that pin the template's files change by the human's leave (FEATURE decision 49).\n\n## Interface\n\n`template/Makefile` (new), exactly this text; recipe lines start with one tab:\n\n```make\n# The contract between a project and the factory is three targets: `check`, `lint`, `test`.\n# `check` is what every stage must pass; `lint` and `test` are what the tests stage runs on its\n# own (the type check is skipped there, because the modules under test do not exist yet).\n# `duplicates` and `mutants` are reports outside `check`. A Python example with a src layout.\n#\n# The development dependencies the targets need, pinned in pyproject.toml: ruff, mypy, semgrep,\n# bandit, detect-secrets, pip-licenses, pytest, pytest-cov, pytest-xdist, pylint, vulture,\n# mutmut, and the tool of the layers command (import-linter for `uv run lint-imports`).\n# pyproject.toml configures them (coverage's `source` and `fail_under`, mypy's `strict`, and\n# `[tool.mutmut]`, whose runs leave out the tests that read the source); security/semgrep holds\n# the vendored semgrep rules and .secrets.baseline the reviewed findings of detect-secrets.\n.PHONY: check lint types layers sast secrets licenses test duplicates mutants\n.SILENT:\n\n# What the project decides: the folder of its package, and the command that checks its layers.\nSOURCE = src/<package>\nLAYERS = <layers command>\n\n# One shell per recipe, stopped by its first failing line, so that a recipe can time itself.\nSHELL := /bin/bash\n.SHELLFLAGS := -eu -o pipefail -c\n.ONESHELL:\n\n# `$(start)` opens a recipe and `$(green)` ends it with \"<target>: green (<seconds> s)\",\n# the line the factory's records of project commands read.\nstart = started=$$(date +%s%N)\ngreen = tenths=$$(( ($$(date +%s%N) - started) / 100000000 )); echo \"$@: green ($$((tenths / 10)).$$((tenths % 10)) s)\"\n\ncheck: lint types layers sast secrets licenses test\n\techo \"check: green\"\n\nlint:\n\t$(start)\n\tuv run ruff check --output-format=concise .\n\tuv run ruff format --check --quiet .\n\t$(green)\n\ntypes:\n\t$(start)\n\tuv run mypy\n\t$(green)\n\nlayers:\n\t$(start)\n\t$(LAYERS)\n\t$(green)\n\n# Static analysis: semgrep with rule sets vendored under security/semgrep (copy the sets you\n# want from github.com/semgrep/semgrep-rules; offline and pinned), plus bandit.\nsast:\n\t$(start)\n\tSEMGREP_SEND_METRICS=off uv run semgrep scan --config security/semgrep --metrics=off \\\n\t  --disable-version-check --quiet --error $(SOURCE)\n\tuv run bandit -q -r $(SOURCE)\n\t$(green)\n\n# Secrets beyond the reviewed baseline, in the files changed against origin/main (committed,\n# staged, unstaged or new); every tracked file on main itself or without origin/main.\nsecrets:\n\t$(start)\n\tif [ \"$$(git rev-parse HEAD)\" != \"$$(git rev-parse --verify --quiet origin/main || true)\" ] && base=$$(git merge-base HEAD origin/main 2>/dev/null); then\n\t  files=$$( { git diff --name-only --diff-filter=d \"$$base\"; git ls-files --others --exclude-standard; } | sort -u)\n\telse\n\t  files=$$(git ls-files)\n\tfi\n\tfiles=$$(printf '%s\\n' $$files | grep -vE '^(uv\\.lock|\\.secrets\\.baseline)$$' || true)\n\tif [ -n \"$$files\" ]; then uv run detect-secrets-hook --baseline .secrets.baseline $$files; fi\n\t$(green)\n\n# Licences of the production dependencies against an allow list.\nALLOWED_LICENSES = MIT;MIT License;MIT-0;BSD;BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;ISC;ISC License;Apache-2.0;Apache 2.0;Apache Software License;PSF-2.0;Python Software Foundation License;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);GNU Library or Lesser General Public License (LGPL);Apache-2.0 OR BSD-3-Clause\nlicenses:\n\t$(start)\n\tuv export -q --frozen --no-dev --no-emit-project --format requirements-txt -o .licenses-requirements.txt\n\tuv run pip-licenses --from=mixed --allow-only=\"$(ALLOWED_LICENSES)\" \\\n\t  --packages $$(sed -n 's/^\\([A-Za-z0-9_.-]*\\)==.*/\\1/p' .licenses-requirements.txt) > /dev/null\n\trm -f .licenses-requirements.txt\n\t$(green)\n\n# Every core (pytest-xdist), short tracebacks, no banner; coverage as pyproject.toml sets it,\n# with the lines that miss; the time of every test in the JUnit report .reports/junit.xml.\n# Exit status 5 is pytest's \"no tests collected\": green for the empty project, impossible\n# once the first test exists.\ntest:\n\t$(start)\n\tmkdir -p .reports\n\tuv run pytest -q --no-header --tb=short -p no:cacheprovider -n auto --dist load \\\n\t  --junit-xml=.reports/junit.xml --cov --cov-report=term-missing:skip-covered || [ $$? -eq 5 ]\n\t$(green)\n\n# Similar code (pylint's duplicate-code) and dead code (vulture) in the package, written to\n# .reports/ and counted on the last line, which a report records; never a failure for its findings.\nduplicates:\n\tmkdir -p .reports\n\tuv run pylint --disable=all --enable=duplicate-code --output-format=json --exit-zero $(SOURCE) > .reports/similar-code.json\n\tuv run vulture $(SOURCE) --min-confidence 60 > .reports/dead-code.txt || [ $$? -eq 3 ]\n\tsimilar=$$(grep -c '\"symbol\": \"duplicate-code\"' .reports/similar-code.json || true)\n\tdead=$$(wc -l < .reports/dead-code.txt)\n\techo \"duplicates: $$similar similar code, $$dead dead code, in .reports/\"\n\n# Mutation testing of the modules of the package that one feature's stories changed:\n# `make mutants FEATURE=F0001`. Slow, so not part of `check`; the feature acceptance runs it,\n# and on an acceptance's branch (work-item/<feature id>-A<number>) FEATURE is that feature. A story's\n# commits are those whose subject starts `work item <id>:`, or `<id>:` after a squash merge.\nFEATURE ?= $(shell git rev-parse --abbrev-ref HEAD 2>/dev/null | sed -n 's|^work-item/\\(F[0-9]\\{4\\}\\)-A[0-9]\\{4\\}$$|\\1|p')\nMUTATED = $(wildcard $(shell git log --format= --name-only -E --grep='^(work item )?$(FEATURE)-S[0-9]{4}([: ]|$$)' origin/main -- '$(SOURCE)/*.py' 2>/dev/null | sort -u))\nmutants:\n\t$(start)\n\tif [ -z \"$(FEATURE)\" ]; then echo \"mutants: set FEATURE, as in make mutants FEATURE=F0001\"; exit 2; fi\n\tif [ -z \"$(MUTATED)\" ]; then echo \"mutants: no module under $(SOURCE) changed by $(FEATURE)\"; exit 0; fi\n\tuv run mutmut run $(foreach module,$(MUTATED),\"$(subst /,.,$(patsubst src/%.py,%,$(module))).*\")\n\t# mutmut generates mutants for every module; the ones outside the feature stay \"not checked\".\n\tuv run mutmut results | { grep -v ': not checked$$' || true; }\n\t$(green)\n```\n\n`template/CLAUDE.md`, *Checks*: its one bullet is replaced by these two, and nothing else in the file changes:\n\n```text\n- `make check` must be green before any stage reports done. It runs `make lint` (ruff check and format check), `make types` (`mypy --strict`), `make layers` (<the layers command>), `make sast` (semgrep with the rules in `security/semgrep`, and bandit over <the package folder>), `make secrets` (detect-secrets against `.secrets.baseline`, over the files changed against `origin/main`, every tracked file on `main` itself), `make licenses` (pip-licenses against an allow list for the production dependencies) and `make test` (pytest on every core with pytest-xdist, coverage as `pyproject.toml` sets it, a JUnit report in `.reports/junit.xml`). Each target ends with the line `<target>: green (<seconds> s)`; `make check` ends with `check: green`.\n- `make lint` and `make test` run those two alone. `make duplicates` writes similar code (pylint's duplicate-code) and dead code (vulture) in <the package folder> to `.reports/` and counts them on its last line: a report, never a check. `make mutants FEATURE=<feature id>` runs mutmut over the modules of <the package folder> that the feature's story commits on `origin/main` changed (`work item <id>: ...`, or the pull request's title `<id>: ...` after a squash merge), and lists the surviving mutants: run by the feature acceptance, never part of `make check`; mutmut rewrites the source with its own import, so its runs leave out the tests that read the source (`pytest_add_cli_args` in `[tool.mutmut]` of `pyproject.toml`). The pipeline definition names `check`, `lint` and `test`; a project that wants the duplicates report after the coder adds `duplicates` to its `project_commands` and to the `reports` of the stage `doing`.\n```\n\nTests:\n\n- New: `tests/test_template_makefile.py`. The behaviour tests copy `template/Makefile` into `tmp_path / \"project\"` and run `make <target>` there with `run_process` (`factory.adapters.process`), stderr merged, the environment of `os.environ` without `MAKEFLAGS`, `MFLAGS`, `MAKELEVEL`, `FEATURE`, `SOURCE` and `LAYERS` (an outer `make`, such as `make mutants FEATURE=F0012` running the tests through mutmut, passes its variables on through `MAKEFLAGS`), with `tmp_path / \"bin\"` first on `PATH`; that folder holds the recording stand-in of `tests/adapters/claude_stand_in.py`, written with `write_stand_in(tmp_path / \"bin\", steps)` and renamed from `claude` to `uv`: it plays one `Step` (its `stdout` and `exit_status`) per call, in the order the recipe calls the tools, and records each call in `tmp_path / \"bin\"`, outside `project` (so that `git ls-files --others` never lists it); `read_calls(tmp_path / \"bin\")` gives the calls' arguments. Variables a target needs are given on the command line (`SOURCE=src/todo`, `LAYERS=uv run lint-imports`). A git repository the test needs is made with `run_git` in the copy's folder; `origin/main` is set with `git update-ref refs/remotes/origin/main <commit>`. The text tests read `template/Makefile` itself.\n- By the human's leave (FEATURE decision 49), and no other change to an earlier story's test, in `tests/test_claude_files.py`: `TEMPLATE_RULES_LINES` gets the two bullets of *Checks* in place of the one; `test_template_holds_only_the_rules_file_and_the_pipeline_definition` is renamed `test_template_holds_only_the_rules_file_the_makefile_and_the_pipeline_definition`, expects the entries `[\"CLAUDE.md\", \"Makefile\", \"factory\", \"factory/pipeline.yml\"]` and checks that `template/Makefile` is a file.\n\n## Acceptance criteria\n\n1. `template/` holds exactly `CLAUDE.md`, `Makefile`, `factory` and `factory/pipeline.yml` (the renamed test of the Interface).\n2. The `.PHONY` line of `template/Makefile` names exactly `check lint types layers sast secrets licenses test duplicates mutants`, in that order, and the file has no target `documents`.\n3. The prerequisites of `check` are exactly `lint types layers sast secrets licenses test`, in that order, and its one recipe line is `echo \"check: green\"`.\n4. The file has the placeholder lines `SOURCE = src/<package>` and `LAYERS = <layers command>`.\n5. The comment lines at the top of the file, before its first line that is not a comment, name each of `ruff`, `mypy`, `semgrep`, `bandit`, `detect-secrets`, `pip-licenses`, `pytest`, `pytest-cov`, `pytest-xdist`, `pylint`, `vulture`, `mutmut` and `import-linter`: thirteen rows of one parametrized test.\n6. Each of `lint`, `types`, `layers`, `sast`, `licenses` and `test`, run with a stand-in `uv` that exits 0 for every call, exits with status 0 and ends with a line matching `^<target>: green \\(\\d+\\.\\d s\\)$`; run with a stand-in that exits 1 for every call, it exits with a status other than 0, prints no line containing `green`, and the stand-in was called exactly once (the recipe stops at its first failing line). Twelve rows of one parametrized test.\n7. `make test` calls the stand-in once with arguments that start with `run pytest` and hold `-n auto` and `--junit-xml=.reports/junit.xml`, and leaves the folder `.reports` in the copy's folder; with a stand-in that exits 5 (pytest's status when it collects no test, as on an empty project), it exits with status 0 and ends with a line matching `^test: green \\(\\d+\\.\\d s\\)$`.\n8. `make secrets` in a git repository whose tracked files are `.secrets.baseline`, `Makefile`, `README.md`, `src/todo/a.py` and `uv.lock` calls `uv run detect-secrets-hook --baseline .secrets.baseline` with these files, and ends with `secrets: green (<seconds> s)` in every row: on `main` with `origin/main` at `HEAD`, the files `Makefile README.md src/todo/a.py`; with no `origin/main`, the same three; on a branch `work-item/F0001-S0001` from `origin/main` with one commit changing `src/todo/a.py`, an untracked `src/todo/b.py` and an unstaged change of `uv.lock`, the files `src/todo/a.py src/todo/b.py`; on such a branch whose one commit changes only `uv.lock`, no call of the stand-in; and on the branch whose commit changes `src/todo/a.py`, a stand-in that exits 1 (detect-secrets found a secret) gives a status other than 0 and no line containing `green`. Five rows of one parametrized test. <!-- pragma: allowlist secret -->\n9. `make duplicates SOURCE=src/todo` ends with the line `duplicates: <n> similar code, <k> dead code, in .reports <script>
const D = JSON.parse(document.getElementById('data').textContent);
const T0 = Date.parse(D.start), T1 = Date.parse(D.end) + 5 * 60e3, PX = 2.4 / 60e3; // 2.4 px per minute
const COLW = 96, LEFT = 250;
const stages = D.stages, sidx = Object.fromEntries(stages.map((s, i) => [s.id, i]));
const y = t => 12 + (Date.parse(t) - T0) * PX;
const fmt = t => new Date(t).toISOString().slice(11, 16) + 'Z';
const mins = s => (s / 60).toFixed(1);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const items = D.items.map((d, i) => { d.hue = (i * 47) % 360; return d; });
const lastOf = (arr, f) => { for (let i = arr.length - 1; i >= 0; i--) if (f(arr[i])) return arr[i]; };

function status(d) {
  const last = d.segments[d.segments.length - 1] || {};
  if (d.events.some(e => e.kind === 'booked')) return ['done', 'b-done'];
  if (last.outcome === 'running') return ['running', 'b-run'];
  if (last.outcome === 'stalled') return ['stalled', 'b-stall'];
  if (last.outcome === 'accept' || last.outcome === 'question') return ['waiting', 'b-wait'];
  return ['open', 'b-run'];
}

// Waits for the human: from the demo stage's end to the merge, and from a question to its answer.
items.forEach(d => {
  d.waits = [];
  const m = d.events.find(e => e.kind === 'merged');
  const a = lastOf(d.segments, s => s.outcome === 'accept');
  if (a && m) d.waits.push({ stage: 'accept', start: a.end, end: m.t });
  d.events.filter(e => e.kind === 'question').forEach(q => {
    const ans = d.events.find(e => e.kind === 'answer' && e.t > q.t);
    const s = lastOf(d.segments, s => s.end && s.end <= q.t);
    if (s) d.waits.push({ stage: s.stage, start: q.t, end: ans ? ans.t : D.end, q: true });
  });
});

const total = items.reduce((a, d) => a + d.cost, 0);
document.getElementById('meta').textContent =
  `${D.feature} · ${fmt(D.start)}–${fmt(D.end)} · ${items.length - 1} stories and one acceptance · $${total.toFixed(2)} agent cost`;

const heads = document.getElementById('heads'), mbody = document.getElementById('mbody'), map = document.getElementById('map');
const W = LEFT + COLW * stages.length, H = y(new Date(T1).toISOString()) + 20;
map.style.width = W + 'px';
heads.style.gridTemplateColumns = `${LEFT}px repeat(${stages.length},${COLW}px)`;
mbody.style.height = H + 'px';
heads.innerHTML = `<div class="gutterhead"><button class="feat-btn" data-feature="1"><span class="dot" style="background:var(--accent)"></span><span>F0012 Housekeeping</span><span class="badge b-run">accepting</span></button></div>` + stages.map(s =>
  `<button class="stagehead" data-stage="${s.id}">${s.id}<small>${s.role || (s.id === 'done' ? 'merged' : 'human')}</small></button>`).join('');

let html = '', paths = '';
for (let t = Math.ceil(T0 / 36e5) * 36e5; t < T1; t += 36e5)
  html += `<div class="tick" style="top:${y(new Date(t).toISOString())}px">${new Date(t).toISOString().slice(11, 16)}</div>`;
stages.forEach((s, i) => { html += `<div class="col" style="left:${LEFT + i * COLW}px;width:${COLW}px"></div>`; });

items.forEach((d, k) => {
  const col = `hsl(${d.hue} var(--seg-s) var(--seg-l))`, lane = (k % 3) * 10, pts = [];
  const add = (s, cls) => {
    const i = sidx[s.stage];
    if (i === undefined) return;
    const top = y(s.start), bot = s.end ? y(s.end) : H - 20, x = LEFT + i * COLW + 16 + lane;
    html += `<div class="seg ${cls}" tabindex="0" data-item="${d.id}" title="${esc(d.id)} · ${s.stage}" style="left:${x}px;width:${COLW - 40}px;top:${top}px;height:${Math.max(3, bot - top)}px;background:${col}"></div>`;
    return [x + (COLW - 40) / 2, top, bot];
  };
  d.segments.forEach(s => {
    const p = add(s, s.outcome === 'stalled' ? 'stalled' : s.outcome === 'running' ? 'running' : '');
    if (p) pts.push(p);
  });
  d.waits.forEach(w => {
    const p = add(w, 'wait');
    if (!p) return;
    if (w.q) html += `<div class="qmark" style="left:${p[0]}px;top:${p[1]}px"></div>`;
    else pts.push(p);
  });
  const b = d.events.find(e => e.kind === 'booked');
  if (b) {
    const bx = LEFT + sidx.done * COLW + COLW / 2, by = y(b.t);
    pts.push([bx, by, by]);
    html += `<div class="seg" data-item="${d.id}" tabindex="0" title="${esc(d.id)} merged" style="left:${bx - 5}px;width:10px;top:${by - 5}px;height:10px;border-radius:50%;background:${col}"></div>`;
  }
  pts.sort((p, q) => p[1] - q[1]);
  let dp = '';
  for (let j = 1; j < pts.length; j++) {
    const [x0, , b0] = pts[j - 1], [x1, t1] = pts[j], m = (b0 + t1) / 2;
    dp += `M${x0},${b0} C${x0},${m} ${x1},${m} ${x1},${t1} `;
  }
  if (dp) paths += `<path data-item="${d.id}" d="${dp}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
});
mbody.innerHTML = html + `<svg class="links" width="${W}" height="${H}">${paths}</svg>`;

const stories = items.filter(d => d.id !== 'F0012-ACCEPTANCE'), acc = items.find(d => d.id === 'F0012-ACCEPTANCE');
let gutter = `<div class="gutter" style="position:absolute;left:0;top:0;width:${LEFT}px;height:${H}px">`, lastY = -99;
[...stories, ...(acc ? [acc] : [])].forEach(d => {
  if (!d.segments.length) return;
  const [st, c] = status(d), label = d.id === 'F0012-ACCEPTANCE' ? 'A' : d.id.slice(6, 11);
  const top = Math.max(y(d.segments[0].start) - 10, lastY + 21); lastY = top;
  gutter += `<button class="label" data-item="${d.id}" style="top:${top}px" title="${esc(d.title)}"><span class="dot" style="background:hsl(${d.hue} var(--seg-s) var(--seg-l))"></span><span class="name"><span class="fid">${label}</span> ${esc(d.title)}</span><span class="badge ${c}">${st}</span></button>`;
});
mbody.insertAdjacentHTML('afterbegin', gutter + '</div>');
const detail = document.getElementById('detail'), dtitle = document.getElementById('dtitle');
const sendBacks = d => d.segments.filter(s => s.outcome && sidx[s.outcome] !== undefined && sidx[s.outcome] < sidx[s.stage]).length;

// The story file: chapters are its "## " sections (outside code fences); the log's entries are
// "N. speaker: text" at column 0 with indented continuation lines (v1's form). v1.1 keeps speaker
// and kind as records in the front matter, and with `at` and `stage` the grouping needs no parsing.
const SPEAKER_STAGE = { intake: 'ready', tester: 'tests', coder: 'doing', reviewer: 'review', documenter: 'docs', demo: 'demo', acceptor: 'feature' };
function splitStory(text) {
  const body = text.replace(/^---\n[\s\S]*?\n---\n/, '');
  const chapters = [], lines = body.split('\n');
  let cur = null, fence = false;
  for (const line of lines) {
    if (/^\s*```/.test(line)) fence = !fence;
    const h = !fence && /^## (.+)$/.exec(line);
    if (h) { cur = { title: h[1], lines: [] }; chapters.push(cur); }
    else if (cur) cur.lines.push(line);
  }
  const logIdx = chapters.findIndex(c => /^Log\b|^Journal\b/.test(c.title));
  const log = logIdx >= 0 ? chapters.splice(logIdx, 1)[0] : { lines: [] };
  const journal = [];
  for (const line of log.lines) {
    const m = /^(\d+)\. ([a-z]+)\b(.*)$/.exec(line);
    if (m) journal.push({ n: +m[1], speaker: m[2], text: (m[2] + m[3]).trim() });
    else if (journal.length) journal[journal.length - 1].text += '\n' + line.replace(/^ {3}/, '');
  }
  journal.forEach(e => { e.text = e.text.replace(/\s+$/, ''); });
  return {
    chapters: chapters.map(c => {
      const b = c.lines.join('\n').trim();
      const crit = (b.match(/^\d+\. /gm) || []).length;
      return { title: c.title, body: b, count: crit ? ` · ${crit}` : '' };
    }),
    journal,
  };
}
function stageVisits(d, journal) {
  const visits = [], used = new Set();
  for (const e of journal) {
    const stage = SPEAKER_STAGE[e.speaker] || (e.speaker === 'human' ? 'answer' : e.speaker === 'done' ? 'done' : e.speaker);
    const last = visits[visits.length - 1];
    if (last && last.speaker === e.speaker && last.stage === stage) { last.entries.push(e); continue; }
    let seg = null;
    const i = d.segments.findIndex((s, k) => !used.has(k) && s.stage === stage);
    if (i >= 0 && SPEAKER_STAGE[e.speaker]) { used.add(i); seg = d.segments[i]; }
    visits.push({ stage, speaker: e.speaker, seg, entries: [e] });
  }
  return visits;
}
function renderText(t) {
  // The story's Markdown, rendered and sanitized (agents wrote it); plain text if the libraries did not load.
  if (window.marked && window.DOMPurify)
    return `<div class="md">${DOMPurify.sanitize(marked.parse(t, { gfm: true, breaks: false }))}</div>`;
  return `<div class="txt">${esc(t)}</div>`;
}

function select(kind, id) {
  document.querySelectorAll('[aria-current]').forEach(e => e.removeAttribute('aria-current'));
  document.getElementById('factoryBtn').setAttribute('aria-pressed', String(kind === 'factory'));
  mbody.classList.toggle('dim', kind === 'item');
  document.querySelectorAll('.seg,.links path').forEach(e => e.classList.toggle('on', kind === 'item' && e.dataset.item === id));
  if (kind === 'item') {
    const d = items.find(x => x.id === id);
    document.querySelector(`.label[data-item="${id}"]`)?.setAttribute('aria-current', 'true');
    dtitle.textContent = d.id === 'F0012-ACCEPTANCE' ? 'Acceptance' : 'Story';
    const { chapters, journal } = splitStory(d.text);
    const visits = stageVisits(d, journal);
    const chapterHtml = chapters.map((c, i) =>
      `<details class="chap"${i === 0 ? ' open' : ''}><summary>${esc(c.title)}<span class="hint">${c.count}</span></summary>${renderText(c.body)}</details>`).join('');
    const visitHtml = visits.map(v => {
      const time = v.seg ? `${fmt(v.seg.start)} · ${v.seg.seconds != null ? mins(v.seg.seconds) + ' min' : 'running'}${v.seg.cost != null ? ' · $' + v.seg.cost.toFixed(2) : ''}` : '';
      const out = v.seg && v.seg.outcome ? `→ ${esc(v.seg.outcome)}` : '';
      const cls = v.seg?.outcome === 'stalled' ? ' stall' : v.seg?.outcome === 'question' ? ' ask' : (v.seg && sidx[v.seg.outcome] < sidx[v.stage]) ? ' back' : '';
      return `<details class="visit${cls}"><summary><span class="vstage">${esc(v.stage)}</span><span class="vwho">${esc(v.speaker)}</span><span class="vtime">${time}</span><span class="vout">${out}</span></summary>${v.entries.map(e => `<div class="entry"><span class="enum">${e.n}</span>${renderText(e.text)}</div>`).join('')}</details>`;
    }).join('');
    detail.innerHTML = `<h3>${esc(d.title)}</h3>
      <dl class="kv"><dt>Id</dt><dd>${d.id}</dd><dt>State</dt><dd>${esc(d.state)}</dd>
      ${d.pr ? `<dt>Pull request</dt><dd><a href="https://github.com/pkrahmer/factory-rf/pull/${d.pr}" target="_blank" rel="noopener">#${d.pr}</a></dd>` : ''}
      <dt>Agent cost</dt><dd>$${d.cost.toFixed(2)} over ${d.segments.length} runs</dd><dt>Send-backs</dt><dd>${sendBacks(d)}</dd></dl>
      <div class="part"><h4>The story</h4>${chapterHtml}</div>
      <div class="part"><h4>The journal, by stage visit</h4>${visitHtml || '<p class="hint">No journal yet.</p>'}</div>`;
    document.querySelector(`.seg[data-item="${id}"]`)?.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });
  } else if (kind === 'stage') {
    const s = stages.find(x => x.id === id);
    document.querySelector(`.stagehead[data-stage="${id}"]`).setAttribute('aria-current', 'true');
    dtitle.textContent = 'Stage';
    const runs = items.flatMap(d => d.segments.filter(x => x.stage === id));
    const sec = runs.reduce((a, x) => a + (x.seconds || 0), 0), cost = runs.reduce((a, x) => a + (x.cost || 0), 0);
    detail.innerHTML = `<h3>${id}${s.role ? ' · ' + s.role : ''}</h3>
      <dl class="kv"><dt>Runs</dt><dd>${runs.length}</dd><dt>Agent minutes</dt><dd>${mins(sec)}</dd><dt>Cost</dt><dd>$${cost.toFixed(2)}</dd>
      ${s.lane ? `<dt>Write paths</dt><dd>${esc(s.lane)}</dd>` : ''}</dl>
      <p class="hint">From factory/stages.yml</p><pre>${esc(s.config) || '(no block)'}</pre>
      ${s.agent ? `<p class="hint">claude/agents/${s.role}.md</p><pre>${esc(s.agent)}</pre>` : ''}`;
  } else if (kind === 'feature') {
    document.querySelector('.feat-btn').setAttribute('aria-current', 'true');
    dtitle.textContent = 'Feature';
    detail.innerHTML = `<h3>F0012 Housekeeping</h3>
      <dl class="kv"><dt>Stories</dt><dd>${stories.length}</dd><dt>Done</dt><dd>${stories.filter(d => status(d)[0] === 'done').length}</dd>
      <dt>Agent cost</dt><dd>$${total.toFixed(2)}</dd><dt>Send-backs</dt><dd>${items.reduce((a, d) => a + sendBacks(d), 0)}</dd>
      <dt>Questions</dt><dd>${items.reduce((a, d) => a + d.events.filter(e => e.kind === 'question').length, 0)}</dd></dl>
      <p class="hint">Select a story on the left or its path on the map for its full text.</p>`;
  } else {
    dtitle.textContent = 'Factory log';
    detail.innerHTML = `<p class="hint">v1's tick log for this feature, newest first. Select a stage, a story or the feature for its text; Escape or a click on the empty map comes back here.</p><pre>${esc(D.log.slice().reverse().join('\n'))}</pre>`;
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-item],[data-stage],[data-feature],#factoryBtn');
  if (t?.dataset.item) select('item', t.dataset.item);
  else if (t?.dataset.stage) select('stage', t.dataset.stage);
  else if (t?.dataset.feature) select('feature');
  else if (t?.id === 'factoryBtn' || e.target.closest('#mbody')) select('factory');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('seg')) select('item', e.target.dataset.item);
  if (e.key === 'Escape') select('factory');
});
select('factory');
</script>
