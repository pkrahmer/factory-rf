<title>Factory Status Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes (work tree | stage-by-time map | selection text), the map is the instrument. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2320; --muted:#5f6a64; --line:#d9ddd9; --grid:#e8ebe8;
  --accent:#2f6f5e; --wait:#b7791f; --stall:#b42318; --ok:#2f6f5e; --run:#1f5fae; --sel:#1d2320;
  --seg-l:46%; --seg-s:42%;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1c211f; --ink:#e4e8e5; --muted:#9aa59f; --line:#2f3633; --grid:#232926;
  --accent:#6fbfa6; --wait:#e0a84f; --stall:#f07a6a; --ok:#6fbfa6; --run:#7aa8e6; --sel:#e4e8e5; --seg-l:62%; --seg-s:40%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1c211f; --ink:#e4e8e5; --muted:#9aa59f; --line:#2f3633; --grid:#232926;
  --accent:#6fbfa6; --wait:#e0a84f; --stall:#f07a6a; --ok:#6fbfa6; --run:#7aa8e6; --sel:#e4e8e5; --seg-l:62%; --seg-s:40%; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
header h1{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.factory-btn{font:inherit;font-weight:600;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.factory-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.meta{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column}
.pane h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 12px 6px;font-weight:600}
.scroll{overflow:auto;min-height:0;flex:1}
/* tree */
.tree{list-style:none;margin:0;padding:0 6px 10px}
.tree button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer}
.tree button:hover{background:var(--grid)}
.tree button:focus-visible,.stagehead:focus-visible,.seg:focus-visible,.factory-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tree button[aria-current="true"]{background:var(--grid);box-shadow:inset 2px 0 0 var(--sel)}
.tree .fid{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tree .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .feat{font-weight:600}
.badge{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:9px;border:1px solid currentColor}
.b-done{color:var(--ok)} .b-run{color:var(--run)} .b-stall{color:var(--stall)} .b-wait{color:var(--wait)}
.dot{width:8px;height:8px;border-radius:50%}
/* map: the work gutter (stories at their start time) scrolls with the stages */
.gutter{position:sticky;left:0;z-index:2;background:var(--panel);border-right:1px solid var(--line)}
.heads .gutterhead{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 6px}
.label{all:unset;box-sizing:border-box;position:absolute;left:40px;right:4px;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;height:20px;padding:0 4px;border-radius:4px;cursor:pointer;font-size:12px}
.label:hover{background:var(--grid)} .label[aria-current="true"]{background:var(--grid);box-shadow:inset 2px 0 0 var(--sel)}
.label:focus-visible{outline:2px solid var(--accent)}
.label .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .label .fid{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.feat-btn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;width:100%;font-weight:600;font-size:12px;padding:4px;border-radius:4px}
.feat-btn[aria-current="true"]{background:var(--grid)} .feat-btn:focus-visible{outline:2px solid var(--accent)}
/* map */
.mapwrap{overflow:auto;flex:1;min-height:0;position:relative}
.map{position:relative}
.heads{position:sticky;top:0;z-index:3;display:grid;background:var(--panel);border-bottom:1px solid var(--line)}
.stagehead{all:unset;cursor:pointer;text-align:center;padding:8px 2px;font-weight:600;font-size:12px;border-left:1px solid var(--grid)}
.stagehead small{display:block;font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:10px}
.stagehead[aria-current="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.body{position:relative}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.tick{position:absolute;left:0;right:0;z-index:3;pointer-events:none;border-top:1px dashed var(--grid);font-family:var(--f-mono);font-size:10px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums}
.seg{position:absolute;border-radius:3px;cursor:pointer;min-height:3px}
.seg.wait{background:repeating-linear-gradient(135deg,var(--wait) 0 3px,transparent 3px 6px)!important;opacity:.8}
.seg.stalled{outline:2px solid var(--stall);outline-offset:-1px}
.seg.running{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.seg.running{animation:none}}
svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.dim .seg:not(.on){opacity:.18} .dim svg path:not(.on){opacity:.12}
.qmark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--wait);border:2px solid var(--panel);transform:translate(-50%,-50%);pointer-events:none}
/* details */
.detail{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.detail h3{margin:0;font-size:16px;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0}
pre{font-family:var(--f-mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-width:100%;box-sizing:border-box}
table.runs{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
table.runs td,table.runs th{border-bottom:1px solid var(--grid);padding:3px 4px;text-align:left}
table.runs th{color:var(--muted);font-weight:500}
a{color:var(--accent)}
.hint{color:var(--muted);font-size:12px}
@media (max-width:900px){
  body{height:auto} main{grid-template-columns:1fr;grid-auto-rows:auto}
  .mapwrap{max-height:75vh} .pane.detail-pane .scroll{max-height:none}
}

/* the selection: the story in chapters, the journal in stage visits */
.part{display:flex;flex-direction:column;gap:4px}
.part h4{margin:6px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
details.chap,details.visit{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
details>summary{cursor:pointer;padding:6px 10px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"B8";color:var(--muted);font-size:10px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details>summary::before{transition:none}}
details.chap>summary{font-weight:600}
details[open]>:not(summary){margin:0 10px 8px}
.txt{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5}
.txt code,.entry code{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);padding:0 3px;border-radius:3px}
.vstage{font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:52px}
.vwho{color:var(--muted);font-size:12px}
.vtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-left:auto}
.vout{font-family:var(--f-mono);font-size:11px}
details.visit{border-left:3px solid var(--ok)}
details.visit.back{border-left-color:var(--wait)} details.visit.ask{border-left-color:var(--run)} details.visit.stall{border-left-color:var(--stall)}
.entry{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;padding-top:4px;border-top:1px dashed var(--grid)}
.entry:first-of-type{border-top:0}
.enum{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}

/* rendered Markdown of the story and its journal */
.md{font-size:12.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.md>:first-child{margin-top:0} .md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol{margin:0 0 .55em} .md ul,.md ol{padding-left:1.3em} .md li{margin:.15em 0}
.md h1,.md h2,.md h3,.md h4{font-size:12.5px;margin:.8em 0 .3em;text-wrap:balance}
.md code{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);padding:0 3px;border-radius:3px}
.md pre{margin:.4em 0 .6em;overflow-x:auto;white-space:pre} .md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:11.5px;display:block;overflow-x:auto;max-width:100%;margin:.4em 0 .6em}
.md th,.md td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.md th{background:var(--bg);font-weight:600}
.md blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)} .md strong{font-weight:600}
</style>
<header>
  <h1>Factory Status Map</h1>

</header>

 "booked"}], "text": "---\nstage: done\npr: 153\nblocked: null\ncomments_seen: 1\nround: 0\nattempts: 1\n---\n# One prepared remote per test session\n\n## Assignment (as of log entry 1)\n\n`make test` is 88 % of `make check`, and 48 s of its 148 s of test time are fixtures' setup, mostly a real git remote built for each test: `make_remote` in `tests/git_support.py` runs six git processes (a seed repository, its commit, a bare repository, a push) every time the `remote` fixture or `build_world` is used. This story builds that remote once per test session (once per pytest-xdist worker, after the human's change H1) and gives each test a copy of the whole folder, seed and bare repository alike, so every test still starts from the same layout and what it pushes stays its own. It is test support only: the tester writes the helper, the fixtures and the new tests under `tests/`, so its tests pass at the tests stage, and the coder expects to change nothing under `src/` and only confirms `make check`. What any existing test asserts does not change; the human's leave covers the three helper files (FEATURE decision 32).\n\n## Interface\n\n`tests/git_support.py` gains one function; `make_remote` does not change:\n\n```python\ndef copy_remote(template: Path, root: Path) -> Path:\n    \"\"\"Copy the folder `template`, which `make_remote` filled, into `root`; return `root / \"remote.git\"`.\"\"\"\n```\n\n- `template` is the `root` an earlier `make_remote(template)` call filled: it holds `seed/` and `remote.git/`.\n- `root` is created when missing (with its parents), and an existing `root` that holds neither is used as it is; a `root` that already holds `seed` or `remote.git` is refused with `FileExistsError`, and neither folder is copied.\n- It copies files only: no git process runs, so it works with no `git` on the `PATH`.\n\n`tests/conftest.py`:\n\n```python\n@pytest.fixture(scope=\"session\")\ndef remote_template(tmp_path_factory: pytest.TempPathFactory) -> Path:\n    \"\"\"Return the folder of one remote made per session, which each test's remote copies.\"\"\"\n    # make_remote(tmp_path_factory.mktemp(\"remote-template\")).parent\n\n@pytest.fixture\ndef remote(tmp_path: Path, remote_template: Path) -> Path:\n    # copy_remote(remote_template, tmp_path / \"origin\")   (was: make_remote(tmp_path / \"origin\"))\n\n@pytest.fixture\ndef world(tmp_path: Path, remote_template: Path) -> World:\n    # build_world(tmp_path, template=remote_template)\n```\n\n`tests/proof_support.py`: `build_world(root: Path, *, template: Path | None = None) -> World`. With a `template`, its remote is `copy_remote(template, root / \"origin\")`; without one, `make_remote(root / \"origin\")` as today, so `run_case` and the acceptance scripts outside pytest still work.\n\nTests: a new module `tests/test_git_support.py`, with real git in `tmp_path` and the helpers `run_git`, `remote_commit`, `clone`, `make_remote` and `REMOTE_FILES` of `tests/git_support.py`; criterion 6 reads the `remote` and `remote_template` fixtures, every other criterion builds its own template with `make_remote`.\n\n## Acceptance criteria\n\n1. `copy_remote(template, root)` returns `root / \"remote.git\"`, a bare repository whose `main` is the commit the template's `remote.git` holds as `main`, and `root / \"seed\"` exists.\n2. A clone of the copy holds on `main` exactly the files of `REMOTE_FILES` with their texts.\n3. With a template made in the test by `make_remote(tmp_path / \"template\")` (never the session's `remote_template`): a commit pushed to `main` of the copy leaves the template's `main` at the commit it had, and a commit pushed to the template's `main` leaves the copy's `main` at the commit it had.\n4. `copy_remote` into a `root` that does not exist yet (two levels deep) creates it, and into an existing empty `root` it copies as well; into a `root` that already holds `remote.git`, or `seed`, it raises `FileExistsError`, leaves that folder as it was and does not create the other one. The four cases are rows of one parametrized test.\n5. With `PATH` set to an empty folder (`monkeypatch`), `copy_remote` still returns the copy; with `PATH` restored, the copy's `main` is the template's `main` commit.\n6. The `remote` fixture's path is `tmp_path / \"origin\" / \"remote.git\"`, it is not inside the `remote_template` folder, and its `main` is the template's `main` commit.\n7. `build_world(root, template=template)` builds a world whose remote's `main` is the template's `main` commit; `build_world(root)` without a template still builds a world whose remote holds `REMOTE_FILES` on `main`.\n8. `make check` stays green.\n9. docs: the project guide's paragraph on the `remote` fixture (section *The git wrapper*) says that the remote is built once per session (once per worker) and copied for each test with `copy_remote`, and that a test needing a remote of its own layout builds it with `make_remote`; the sentence on the `world` fixture (section *Kill points*, *The kill-point cases*) says it builds the world on a copy of that remote. No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/test_git_support.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/adapters/test_git_cli_writing.py tests/test_kill_points.py 2>&1 | tail -1\n```\nExpect: one line that reports `passed` and neither `failed` nor `error`.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names concrete modules and signatures (`copy_remote` in `tests/git_support.py`, fixtures `remote_template`, `remote` and `world` in `tests/conftest.py`, `build_world(root, *, template=None)` in `tests/proof_support.py`), and the new test module. Each behaviour in it is stated precisely: the return value, root creation, the refusal with `FileExistsError`, and no git process.\n   - Criteria: criteria 1 to 7 are each testable by one test function. Criterion 4 is one parametrized test with both sides of the rule: the two accepted roots, a missing one and an empty one, and the two refused roots, one holding `seed` and one holding `remote.git`. The refused rows also check that nothing is created. Criterion 5 covers the no-git rule. Criteria 3 and 6 pin the independence of the copy and its location. Criterion 7 covers both sides of the `template` parameter. Criteria 8 and 9 are the closing `make check` and docs criteria.\n   - Demo: both commands are runnable. Each Expect line names an output that can be checked: the last line `<n> passed` with no failed, error or skipped count, and one line reporting `passed` with no `failed` or `error`.\n   - Architecture: test support under `tests/` only, with nothing under `src/`. It follows CLAUDE.md: real git, no faked git, and fixtures in `tests/conftest.py`.\n   - Scope: it matches FEATURE.md item 1.1 (\"one prepared git remote copied per test (S0001)\"). Decision 32 grants the leave to change the three helper files. Nothing in \"Out of scope\" is touched.\n3. tester: I wrote the helper, the fixtures and the tests, all under `tests/`. The suite is green, not red: the story is test support only, so the code the tests exercise lives in `tests/` and is already there. `make test` passes in 34.8 s with 99.53 % coverage. `make lint` and `make types` are green too.\n   - Helper: `tests/git_support.py::copy_remote(template, root)`. It first refuses a `root` that holds `seed` or `remote.git` with `FileExistsError`, before it creates or copies anything. Then it runs `mkdir(parents=True, exist_ok=True)` and `shutil.copytree(..., symlinks=True)` on `seed/` and `remote.git/`. No git process runs.\n   - Fixtures in `tests/conftest.py`:\n     - new session-scoped `remote_template`, which is `make_remote(tmp_path_factory.mktemp(\"remote-template\")).parent`;\n     - `remote` onds": 19}], "events": [{"t": "2026-10-17T09:58:59Z", "kind": "question"}, {"t": "2026-10-17T09:59:22Z", "kind": "answer"}, {"t": "2026-10-17T10:10:04Z", "kind": "merged"}, {"t": "2026-10-17T10:10:08Z", "kind": "booked"}], "text": "---\nstage: done\npr: 154\nblocked: null\ncomments_seen: 2\nround: 0\nattempts: 0\n---\n# The duplicates report\n\n## Assignment (as of log entry 1)\n\nThe reviewer counts a second copy of a helper as a finding, but only where it happens to see one; three feature acceptances found copies that no story owned. This story builds the report the human's `make duplicates` target prints (change H3, after this story): it reads pylint's duplicate-code messages (R0801, as JSON) and vulture's dead-code lines, keys each finding without its line numbers, compares the keys with a baseline of accepted findings, and prints the new findings, the baseline keys no longer found, and one closing line that v1 writes into the coder's entry as a record. The rules are pure functions in `factory.domain.duplicates`; the command `python -m factory.entry.check_duplicates` only reads the files. pylint and vulture are development dependencies (change H2, before this story); this story does not run them: its tests feed it texts in their formats.\n\n## Interface\n\n`src/factory/domain/duplicates.py`:\n\n```python\nclass DuplicateFinding(BaseModel):\n    \"\"\"A similar block or a piece of dead code: its line-independent key, where it is, what it is.\"\"\"\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    key: str\n    where: str\n    message: str\n\n\nclass DuplicateReport(BaseModel):\n    \"\"\"The findings not in the baseline, the count of those in it, and baseline keys not found.\"\"\"\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    new: list[DuplicateFinding]\n    known: NonNegativeInt\n    gone: list[str]\n\n\ndef similar_code_findings(pylint_json: str) -> list[DuplicateFinding]: ...\ndef dead_code_findings(vulture_text: str) -> list[DuplicateFinding]: ...\ndef read_baseline(text: str) -> list[str]: ...\ndef compare(findings: Sequence[DuplicateFinding], baseline: Sequence[str]) -> DuplicateReport: ...\ndef report_lines(report: DuplicateReport) -> list[str]: ...\n```\n\n`similar_code_findings`: the text is a JSON array of objects (pylint's `--output-format=json`). Each object whose `symbol` is `\"duplicate-code\"` is one finding; objects of any other symbol are ignored. Its `message` is lines: the first (`Similar lines in 2 files`), then one line `==<module>:[<start>:<end>]` per module, then the similar code. The finding's:\n\n- `key` is `similar-code <modules>: <first code line>`, the modules sorted and unique, joined by `, `, and the first code line the first non-blank line after the `==` lines, stripped;\n- `where` is the `==` lines without their `==`, in the message's order, joined by `, ` (`factory.domain.git:[73:77], factory.domain.stops:[49:53]`);\n- `message` is the message's first line.\n\nA text that is not valid JSON, not an array, or holds an element that is not an object or a `duplicate-code` object without a string `message`, raises `ValueError`. A `duplicate-code` message without a `==<module>:[<start>:<end>]` line, with no non-blank code line after its `==` lines, or with a line that starts with `==` but does not match that form, also raises `ValueError`, whose text names the message. An empty array gives no finding.\n\n`dead_code_findings`: every non-blank line must fully match `<path>:<line>: <message> (<n>% confidence)`, optionally with `, <m> line` or `, <m> lines` before the closing parenthesis (vulture's output). The finding's `key` is `dead-code <path>: <message>`, `where` is `<path>:<line>`, `message` is `<message> (<n>% confidence)`. A non-blank line of another form raises `ValueError` naming its 1-based line number. Blank lines are skipped.\n\n`read_baseline`: one key per line, each line stripped; a line whose stripped text is empty or starts with `#` is skipped; es one finding with the key `similar-code factory.domain.git, factory.domain.stops: @field_validator(\"at\")`, the where `factory.domain.stops:[49:53], factory.domain.git:[73:77]` and the message `Similar lines in 2 files`.\n2. The same message with its line numbers changed gives the same key, and so does the same message with a blank line between the last `==` line and the code; with a different first code line it gives another key. Rows of one parametrized test.\n3. A message naming one module twice (`==factory.a:[1:5]` and `==factory.a:[9:13]`, code `x = 1`) gives the key `similar-code factory.a: x = 1`. Objects of another symbol (`unused-import`) give no finding, and `[]` gives none.\n4. Each of these pylint texts raises `ValueError`: `not json`, `{}`, `[1]`, `[{\"symbol\": \"duplicate-code\"}]` (no message), `[{\"symbol\": \"duplicate-code\", \"message\": 5}]` (a message that is not a string). Five rows of one parametrized test.\n5. The vulture line `src/factory/x.py:12: unused function 'helper' (60% confidence)` gives the key `dead-code src/factory/x.py: unused function 'helper'`, the where `src/factory/x.py:12` and the message `unused function 'helper' (60% confidence)`; the same line with `, 3 lines` or with `, 1 line` before the parenthesis gives the same key; a blank line gives nothing. Rows of one parametrized test.\n6. A vulture text whose second line is `oops` raises `ValueError` whose message names line 2; a line `src/x.py: unused function 'f' (60% confidence)` (no line number) and a line with leading spaces raise it too. Rows of one parametrized test.\n7. `read_baseline(\"# comment\\n\\n  similar-code a, b: x  \\n  # indented comment\\ndead-code p: m\\n\")` is `[\"similar-code a, b: x\", \"dead-code p: m\"]`.\n8. `compare` of findings with keys `a`, `d`, `b`, `b` (in that order) against the baseline `[\"e\", \"b\", \"c\"]` gives `new` with the findings `a` and `d` in that order, `known == 2` and `gone == [\"e\", \"c\"]`; against an empty baseline `new om valid values (as its own test module builds it) with the time field set; no existing test changes.\n\n## Acceptance criteria\n\n1. `in_utc(datetime(2026, 10, 12, 14, 0, tzinfo=timezone(timedelta(hours=2))))` is `datetime(2026, 10, 12, 12, 0, tzinfo=UTC)`, and its `tzinfo` is `UTC`.\n2. For each of the five fields, a model built with the aware time `datetime(2026, 10, 12, 14, 0, tzinfo=timezone(timedelta(hours=2)))` holds `datetime(2026, 10, 12, 12, 0, tzinfo=UTC)` in that field, with `tzinfo` `UTC`; and a model built with the naive `datetime(2026, 10, 12, 12, 0)` is refused with `pydantic.ValidationError`. Ten rows of one parametrized test (five fields, two sides); each model is built from valid values of its own types, so the test passes `mypy --strict`.\n3. No module among `factory.domain.cost_records`, `factory.domain.git`, `factory.domain.hosting`, `factory.domain.stops` and `factory.domain.work_item` calls `astimezone` (an `ast.Attribute` named `astimezone` in the module, read with `modules()` of `tests/source_search.py`), and `factory.domain.times` does.\n4. `make check` stays green.\n5. docs: the project guide's paragraph on the state's `Claim` (section *The data of a work item*, *The claim*), which says that `started_at` is stored in UTC, names `UtcDatetime` in `factory.domain.times` as the one way a model converts a time, to be used by every new time field; the other places that say a time is stored in UTC stay as they are. No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run python -c \"\nfrom datetime import datetime, timedelta, timezone\nfrom factory.domain.stops import RepositoryStop\nstop = RepositoryStop(scope='repository', reason='fetch_failed', detail='x', at=datetime(2026, 10, 12, 14, 0, tzinfo=timezone(timedelta(hours=2))))\nprint(stop.at.isoformat())\n\"\ngrep -rn --include='*.py' 'astimezone(UTC)' src/factory/domain/cost_records.py src/factory/domain/git.py src/fac es, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nls tests/test_fault_path_names.py; grep -n \"def _rerun_seconds\\|def _branch_state\\|def _state_at\\|def _opening_text\" tests/proof_support.py tests/test_kill_points.py tests/test_fault_paths_7_to_13.py; echo \"status $?\"\n```\nExpect: an `ls` error that the file does not exist, then `status 1`.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/test_kill_points.py tests/test_proof_support.py tests/test_fault_paths_table.py 2>&1 | tail -1\n```\nExpect: one line that reports `passed` and neither `failed` nor `error`.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names concrete modules and signatures (`tests/proof_support.py`: `rerun_seconds`, `state_at`, `branch_state`; `_kill_to_rerun_recorded`, `_opening_document`, `_rerun` behaviour; `tests/test_kill_points.py`; deletion of `tests/test_fault_path_names.py`). I checked with grep that today's `_rerun_seconds`, `_branch_state`, `_state_at`, `_opening_text`, `_rerun`, `_claim_commits` and `_kill_to_rerun_recorded` exist where the story says. The `_state_at` and `_branch_state` copies in other test modules (under `tests/application/`) are outside the story, as FEATURE decision 33 says.\n   - Criteria: each is testable by one test function. Criteria 2 and 3 name their rows, and each rule has its failing side: killed_at one second earlier, `killed_at=None`, a crash-free case, a missing branch, a path `origin/main` does not hold, and `AssertionError` from `rerun_seconds`. Criterion 4 (AST and absence) is one test, 5 and 6 are existing gates, 7 is the docs criterion.\n   - Demo: both commands are runnable. Each `Expect:` line is checkable (an `ls` error plus `status 1`; a last line with `passed` and no `failed` or `error`).\n   - Architecture: the change is tests only, so it touches no layer. Decision 33 grants the human's leave for editing tests I did not wr  "role": "coder", "start": "2026-10-17T10:47:27Z", "end": "2026-10-17T10:49:28Z", "outcome": "review", "turns": 9, "cost": 0.2, "seconds": 86}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T10:49:31Z", "end": "2026-10-17T10:50:16Z", "outcome": "doing", "turns": 4, "cost": 0.18, "seconds": 41}, {"stage": "doing", "role": "coder", "start": "2026-10-17T10:50:19Z", "end": "2026-10-17T10:51:46Z", "outcome": "question", "turns": 7, "cost": 0.19, "seconds": 83}, {"stage": "doing", "role": "coder", "start": "2026-10-17T10:55:54Z", "end": "2026-10-17T10:56:13Z", "outcome": "tests", "turns": 4, "cost": 0.11, "seconds": 15}, {"stage": "tests", "role": "tester", "start": "2026-10-17T10:56:16Z", "end": "2026-10-17T10:57:34Z", "outcome": "doing", "turns": 5, "cost": 0.18, "seconds": 49}, {"stage": "doing", "role": "coder", "start": "2026-10-17T10:57:37Z", "end": "2026-10-17T10:58:52Z", "outcome": "review", "turns": 4, "cost": 0.1, "seconds": 41}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T10:58:55Z", "end": "2026-10-17T10:59:48Z", "outcome": "docs", "turns": 9, "cost": 0.33, "seconds": 49}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T10:59:51Z", "end": "2026-10-17T11:00:45Z", "outcome": "demo", "turns": 6, "cost": 0.11, "seconds": 18}, {"stage": "demo", "role": "demo", "start": "2026-10-17T11:00:48Z", "end": "2026-10-17T11:01:17Z", "outcome": "accept", "turns": 4, "cost": 0.15, "seconds": 22}], "events": [{"t": "2026-10-17T10:51:53Z", "kind": "question"}, {"t": "2026-10-17T10:55:51Z", "kind": "answer"}, {"t": "2026-10-17T11:03:14Z", "kind": "merged"}, {"t": "2026-10-17T11:03:18Z", "kind": "booked"}], "text": "---\nstage: done\npr: 158\nblocked: null\ncomments_seen: 2\nround: 1\nattempts: 0\n---\n# The fault of an unreadable pipeline definition on one line\n\n<!-- takes in the parked draft F0003-S0011 (proposed by F0003's feature acceptance of 2026-10-14) -->\n\n## Assignment (as of log entry 7)\n\nWhen `factory/pipeline.yml` on `main` is not valid YAML, the stop `pipeline_definition_invalid` carries ruamel.yaml's own error text as its detail, and that text spans four to seven lines. `TimestampedFactoryLog` stamps each line, so the factory log gets one `stop repository pipeline_definition_invalid: not valid YAML: while constructing a mapping` line followed by several stamped lines without the `stop` prefix: `in \"<unicode string>\", line 5, column 3`, the actual problem (`found duplicate key \"done\" ...`), an empty line, and for a repeated key, ruamel's hint `To suppress this check see: https://yaml.dev/...`. An operator who greps the log for `stop repository` sees only the context line and misses the problem. The hint is also wrong advice, because the factory refuses a repeated key on purpose (F0003 decision 11). This story makes the fault one line: ruamel's problem and its 1-based position, with no context lines and no hint. The fault is the same in the health status, the log and `PipelineDefinitionInvalid`. This keeps F0003's kept thing 7 and its Goal's \"a reported stop that names the fault\". F0003's first acceptance found the issue (4.1). F0003's FEATURE.md decision 20 kept it out of F0003-S0008, and no story took it up, so F0003's second acceptance proposed it; the human folded it into this feature (FEATURE decision 5).\n\n## Interface\n\n`src/factory/adapters/pipeline_yaml.py`, `RuamelPipelineDefinitionReader.parse` (changes S0004's YAML fault only)\n\nA new public function in the same module states the rule, and `parse` uses it:\n\n```python\ndef yaml_fault(error: YAMLError) -> str:\n    \"\"\"The one-line fault of ruamel.yaml's `error`: its problem and 1-based position.\"\"\"\n```\n\nWhen ruamel.yaml's safe loader raises a `YAMLError`, `parse` raises `PipelineDefinitionInvalid(yaml_fault(error))`. `yaml_fault` gives:\n\n- `not valid YAML: <problem> (line <l>, column <c>)` when the error is a `ruamel.yaml.error.MarkedYAMLError` with a non-empty `problem` and a `problem_mark`. `<l>` is `problem_mark.line + 1` and `<c>` is `problem_mark.column + 1`.\n- `not valid YAML: <problem>` when it is a `MarkedYAMLError` with a non-empty `problem` but no `problem_mark`.\n- otherwise `not valid YAML: <the first non-blank line of str(error), stripped>`.\n\nRules:\n\n- The fault never contains a line break (`\\n` or `\\r`).\n- A line break inside ruamel's `problem` is written as the two characters `\\n` or `\\r` (a backslash followed by `n` or `r`).\n- `context`, `context_mark`, `note` and ruamel's warning text (`To suppress this check see: ...`) are not part of the fault.\n- Every other fault of `parse` (a text that is not a mapping, the field faults, the rules) is unchanged.\n\nTests: a new file `tests/adapters/test_pipeline_yaml_one_line_fault.py`, through `RuamelPipelineDefinitionReader`, with the texts built from `PIPELINE_YAML` in `tests/git_support.py` (26 lines). Criterion 8 calls `yaml_fault` directly. One case in a new file `tests/application/test_pipeline_loading_yaml_fault.py`, with the fixtures of `tests/conftest.py` that F0003-S0006's tests use (`boundaries`, `human`, `checkout`, `agent_home`) and `install_agents` of `tests/git_support.py`. The existing tests `test_a_text_that_is_not_yaml_is_refused` and `test_a_repeated_key_is_refused_naming_it` still pass unchanged, and no existing test changes.\n\n## Acceptance criteria\n\n1. `PIPELINE_YAML + \"  done: {}\\n\"` (a repeated stage key) is refused with exactly the fault `not valid YAML: found duplicate key \"done\" with value \"{}\" (original value: \"{}\") (line 27, column 3)`.\n2. `PIPELINE_YAML + \"x: [\\n\"` (an unclosed list) is refused with exactly the fault `not valid YAML: did not find expected node content (line 28, column 1)`.\n3. `PIPELINE_YAML` with `crash_cap: 2` replaced by `crash_cap: 2: 3` is refused with exactly the fault `not valid YAML: mapping values are not allowed in this context (line 3, column 13)`.\n4. A Python tag, `PIPELINE_YAML + \"x: !!python/object/apply:os.getcwd []\\n\"`, is refused with a fault that starts with `not valid YAML: could not determine a constructor for the tag` and ends with `(line 27, column 4)`.\n5. A text that holds a control character, `PIPELINE_YAML + 'x: \"\\x07\"\\n'`, which ruamel refuses without a `problem`, is refused with exactly the fault `not valid YAML: unacceptable character #x0007: control characters are not allowed`.\n6. For each text of criteria 1 to 5, the fault contains no `\\n` and no `\\r`. For the text of criterion 1, the fault does not contain `To suppress` and does not contain `<unicode string>`.\n7. `PIPELINE_YAML` itself still parses, and a text that is valid YAML but not a mapping (`\"- a\\n\"`) is still refused with `the pipeline definition must be a mapping`.\n8. `yaml_fault(MarkedYAMLError(context=\"while x\", problem=\"found y\"))` is `not valid YAML: found y`; `yaml_fault(MarkedYAMLError(context=\"while x\", problem=\"\", problem_mark=FileMark(\"<s>\", 0, 4, 2)))` is `not valid YAML: while x` (an empty problem falls to the first line of the text); `yaml_fault(YAMLError(\"plain\\nsecond\"))` is `not valid YAML: plain`. Rows of one parametrized test, the errors built by hand (`ruamel.yaml.error`).\n9. Loaded through `PipelineLoader.load` at `origin/main`, the text of criterion 1 is one reported stop. `load` raises `PipelineDefinitionInvalid`. The health status holds one stop `pipeline_definition_invalid` whose `detail` is the fault of criterion 1. The factory log file gains exactly one line, and that line ends with `stop repository pipeline_definition_invalid: ` followed by that fault.\n10. `\"a: 1\\na: |\\n  x\\n  y\\n\"` (a repeated key whose value is a block scalar) is refused with exactly the fault `not valid YAML: found duplicate key \"a\" with value \"x\\\\ny\\\\n\" (original value: \"1\") (line 2, column 1)`, where each `\\\\n` is a backslash followed by `n`, and the fault contains no `\\n` and no `\\r`.\n11. `make check` stays green.\n12. docs: `docs/project-guide.md`, \"F nges\". Its only pin was that the existing tests pass. The second feature acceptance of F0008 ran a hand mutation pass. It found that five public calls can be given a document without a state, and that each one could raise another exception type, kind or message without any test failing:\n\n- `ClaimService.claim`;\n- `ClaimService.release`;\n- `RecoveryHandler.ask_crash_cap`;\n- `TaskComposer.compose`;\n- `StallService.stall`.\n\nLine coverage does not show the gap. Each call site builds its exception before `require_state` checks the state, so the line that builds it runs on every happy path.\n\nThe human folded it into this feature (FEATURE decision 5). This story pins the refused side of those five calls: the exception type, its fields, and that nothing is written or pushed. The code already behaves as the criteria say. The tester writes the tests, and the coder expects to change nothing in `src/`. If a test fails, the code is wrong and the coder fixes it within the Interface below.\n\n## Interface\n\nNo new or changed names. The behaviour pinned is that of five existing public calls, each given a `WorkItemDocument(state=None, body=<any text>)`:\n\n| Call | Raises |\n|---|---|\n| `ClaimService(boundaries, instance, definition).claim(branch, path, document, stage)` (`src/factory/application/claims.py`) | `ValueError` with the message `the work item has no state to claim` |\n| `ClaimService(...).release(document)` (`src/factory/application/claims.py`) | `ValueError` with the message `the work item has no state to release` |\n| `RecoveryHandler(boundaries, definition, claims, run).ask_crash_cap(snapshot)` (`src/factory/application/recovery.py`), the snapshot's `document` without a state | `CannotHandle` with `kind == \"crash\"` and `reason == \"work item <snapshot.id> has no state\"` |\n| `TaskComposer(boundaries, definition, environment).compose(context, agent)` (`src/factory/application/task.py`), `context.document` without a state | `WorkItemFormatError` with `fault == \"the document has no state\"` and `path == context.path` |\n| `StallService(boundaries, instance, definition).stall(context, reason)` (`src/factory/application/stalls.py`), with `context.document` without a state, `stage_start=None`, `cost=None` and `pull_request` given | `ValueError` with the message `the work item has no state to stall` |\n\nBefore it raises, `claim` leaves the remote's work item branch at the commit it had; `ask_crash_cap` posts nothing and opens no pull request; `stall` leaves the remote's work item branch at the commit it had and posts nothing.\n\nTests: one new module, `tests/application/test_no_state_refusals.py`. It builds each service as its own test module does: `tests/application/test_claims.py` for `ClaimService`, `tests/application/test_recovery_cap.py` for `RecoveryHandler`, `tests/application/test_task.py` for `TaskComposer`, and `tests/application/test_stalls.py` for `StallService`, using the fixtures of `tests/conftest.py`. No existing test module changes.\n\n## Acceptance criteria\n\n1. `ClaimService.claim` with a document without a state raises `ValueError` whose `str` is `the work item has no state to claim`. The remote's work item branch is at the commit it had before the call.\n2. `ClaimService.release` with a document without a state raises `ValueError` whose `str` is `the work item has no state to release`. With a document that has a claimed state, the same call returns a document whose state has `claim is None` (both sides in one parametrized test).\n3. `RecoveryHandler.ask_crash_cap` with a snapshot whose document has no state raises `CannotHandle` with `kind == \"crash\"` and `reason == f\"work item {snapshot.id} has no state\"`. The fake hosting service holds no post and no pull request afterwards.\n4. `TaskComposer.compose` with a context whose document has no state raises `WorkItemFormatError` with `fault == \"the document has no state\"` and `path == context.path`.\n5. `StallService.stall` with a context whose document has no state (`stage_start=None`, `cost=None`, a `pull_request` given) raises `ValueError` whose `str` is `the work item has no state to stall`. The remote's work item branch is at the commit it had before the call, and the fake hosting service holds no post.\n6. make check stays green.\n7. docs: none. The project guide already names `require_state` as the one way to get a document's state and says the caller builds its own exception. These tests pin what it says.\n\n## Demo\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/application/test_no_state_refusals.py\n```\nExpect: the last line is `<n> passed in <time>`, with n at least 6 (criterion 2 has two rows).\n\n```bash\ngrep -c \"def test_\" tests/application/test_no_state_refusals.py\n```\nExpect: a number of at least 5, one test function per call.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: no new names; five existing public calls with concrete module paths, signatures, exceptions and messages. I checked the messages against `src/factory/application` (claims.py 76 and 111, recovery.py 57, task.py 140, stalls.py 137): they match.\n   - Criteria: criteria 1 to 5 each name one call, the exception, its fields or message, and the side effects (branch unchanged, no post, no pull request). Each is testable by one test function. Criterion 2 covers both sides of `release` (no state refused, claimed state cleared) in one parametrized test. Every refusal in the Interface has its criterion, and the Interface has no passing side to add.\n   - Demo: both commands are runnable. The expectations are checkable: `n passed` with n at least 6, and a `def test_` count of at least 5.\n   - Architecture: the story only adds a test module under `tests/application/`, which mirrors the package. It uses the services' existing constructors and the fixtures of `tests/conftest.py`, with the fake hosting service and no mocks of the code under test.\n   - Scope: within F e change is expected: every criterion pins behaviour already built. The tests are new functions, and no earlier test changes. F0011-S0007's docs repair (the reference to \"F0011, decision 13\") is already done by F0012-S0003, which rewrote that sentence for `make documents`.\n\n## Interface\n\n`src/factory/domain/documents.py` does not change. Its constants and rule, as built and as the F0011-S0005 Interface gives them:\n\n- `GLOSSARY_FORBIDDEN == (\"ticket\", \"tickets\", \"lane\", \"lanes\", \"stage table\", \"stages.yml\", \"promote\", \"promoted\", \"acceptor\", \"demonstration\", \"control surface\", \"hardening\", \"memo\", \"lease_minutes\", \"max_attempts\", \"max_rounds\", \"drafts/\", \"ongoing/\")`.\n- `OPERATOR_GUIDE_SECTIONS == (\"Install\", \"Configuration\", \"The stops\")`.\n- `PROJECT_GUIDE_SECTIONS == (\"Kill points\", \"Fault-injection paths\")`.\n- For each entry of `GLOSSARY_FORBIDDEN`, an operator guide that is clean except for the line `It reads <entry> here.` gives exactly the one finding `uses the v1 word '<entry>'` for `docs/operator-guide.md`. No entry contains another entry with a word boundary on both sides, so each line gives one finding only.\n\nTests:\n\n- New test functions in `tests/domain/test_documents.py`: one per tuple for criteria 1 and 2, and one parametrized over `GLOSSARY_FORBIDDEN` itself for criterion 3, with the entry as its id.\n- The texts come from `tests/document_texts.py` (`operator_guide(suffix=...)`) through the module's `_with` and `_finding`. No new helper.\n- No existing test changes. `test_a_v1_word_standing_alone_is_a_finding` keeps its rows, which test letter case and position.\n\n## Acceptance criteria\n\n1. `GLOSSARY_FORBIDDEN` equals the eighteen-entry tuple of the Interface, in that order.\n2. `OPERATOR_GUIDE_SECTIONS` equals `(\"Install\", \"Configuration\", \"The stops\")`, and `PROJECT_GUIDE_SECTIONS` equals `(\"Kill points\", \"Fault-injection paths\")`, each in that order.\n3. For each of the eightee d user may still write on the file system of `path`; `OSError` when it cannot be read.\"\"\"\n\n    @abstractmethod\n    def used_bytes(self, path: Path) -> int:\n        \"\"\"The sizes of the regular files under `path`, symbolic links and other non-regular files skipped; 0 for a missing path.\"\"\"\n```\n\n`src/factory/adapters/disk_space.py` (new): `class ShutilDiskSpace(DiskSpace)`. `free_bytes` is `shutil.disk_usage(path).free`, which raises `FileNotFoundError` for a missing path. `used_bytes` walks `path` without following symbolic links and adds the size of every regular file; a symbolic link (to a file or to a folder) adds nothing, and neither does a file of another kind (a named pipe, which it does not open); it returns 0 when `path` does not exist.\n\n`src/factory/application/boundaries.py`: `Boundaries` gains a last, optional field `disk: DiskSpace | None = None`, after `settings`, so every construction written before it stays valid.\n\n`src/factory/domain/settings.py`: `MIN_FREE_SPACE_VARIABLE = \"FACTORY_MIN_FREE_GB\"`, `DEFAULT_MIN_FREE_GB = 5`, and `InstanceSettings.min_free_gb: PositiveInt = DEFAULT_MIN_FREE_GB`. `read_settings` reads the variable: unset or blank gives 5; a value that, stripped, is ASCII digits only and at least 1 gives that number; anything else raises `SettingsInvalid(MIN_FREE_SPACE_VARIABLE, \"is not a whole number of gigabytes of at least 1\")`.\n\n`src/factory/domain/disk.py` (new):\n\n```python\nGIGABYTE = 10**9\n\ndef gigabytes(byte_count: int) -> str:\n    \"\"\"`byte_count` in gigabytes of 10**9 bytes, rounded down to one decimal: `3.2`.\"\"\"\n\ndef disk_low_detail(free: Mapping[Path, int], minimum_gb: int) -> str | None:\n    \"\"\"The fault of the paths with less than `minimum_gb` gigabytes free, None when all have enough.\"\"\"\n```\n\n`disk_low_detail` names each path with less than `minimum_gb * GIGABYTE` bytes free, in the mapping's order, as `<path> has <gigabytes> GB free, less than the <minimum_gb> GB FACTORY_MIN_FREE_GB asks for`, joined by `; `. Exactly `minimum_gb * GIGABYTE` bytes is enough.\n\n`src/factory/entry/wiring.py`: `build_boundaries` sets `disk=ShutilDiskSpace()`.\n\nTests: `tests/domain/test_disk.py` (criteria 1 and 2), `tests/adapters/test_disk_space.py` (criteria 3 and 4), `tests/domain/test_settings_min_free.py` (criteria 5 and 6), a new test function in `tests/entry/test_wiring_boundaries.py` with that module's `settings` fixture and `FakeHostingService` as `hosting` (criterion 7), and `tests/application/test_disk_space_interface.py` (criterion 8). No existing test changes.\n\n## Acceptance criteria\n\n1. `gigabytes` gives `0.0` for 0, `0.9` for 999_999_999, `1.0` for 1_000_000_000, `3.2` for 3_299_999_999 and `812.3` for 812_345_678_901. Rows of one parametrized test.\n2. `disk_low_detail({Path(\"/work\"): 5 * GIGABYTE}, 5)` is `None`; with `5 * GIGABYTE - 1` it is `/work has 4.9 GB free, less than the 5 GB FACTORY_MIN_FREE_GB asks for`; with `/work` and `/state` both at `1_200_000_000` it names `/work` then `/state`, joined by `; `; with `/work` low and `/state` at 6 GB it names `/work` only. Rows of one parametrized test.\n3. `ShutilDiskSpace().free_bytes(tmp_path)` is positive and at most `shutil.disk_usage(tmp_path).total`; for a missing path it raises `FileNotFoundError`.\n4. `ShutilDiskSpace().used_bytes` of a folder holding files of 3 and 5 bytes and a subfolder with a file of 7 bytes is 15; in that folder, a symbolic link to a file of 100 bytes outside it, a symbolic link to a folder outside it that holds a file of 100 bytes, and a named pipe (`os.mkfifo`) each add nothing; a missing path gives 0. Rows of one parametrized test.\n5. `read_settings` gives `min_free_gb == 5` when `FACTORY_MIN_FREE_GB` is unset or blank, 1 for `1`, 12 for ` 12 `; it raises `SettingsInvalid` with `variable == \"FACTORY_MIN_FREE_GB\"` and `fault == \"is not a whole number of gigabytes of at least 1\"` for `0`, `-1`, `2.5`, `five` and `\"٣\"` (an Arabic-Indic digit). Rows of one parametrized test.\n6. `InstanceSettings` built without `min_free_gb` has `min_free_gb == 5`; with `min_free_gb=1` it is accepted; with `min_free_gb=0` it is refused with `pydantic.ValidationError`. Rows of one parametrized test, the model built through a variable typed `type[BaseModel]`.\n7. `build_boundaries` gives boundaries whose `disk` is a `ShutilDiskSpace`; `Boundaries` built without `disk` has `disk is None`.\n8. `DiskSpace` is an abstract base class whose abstract methods are exactly `free_bytes` and `used_bytes`, and `ShutilDiskSpace` derives from it.\n9. `make check` stays green.\n10. docs: the operator guide's settings table gets the row `FACTORY_MIN_FREE_GB` (optional, whole gigabytes of 10^9 bytes, at least 1, default 5; what it guards comes with the low-disk stop). Its section *The machine's image* says what the container cannot see: under Docker Desktop's WSL 2 backend there is no disk limit, so `df` inside the container shows the virtual disk (about 1 TB) and a check of free space inside it fires only on a Linux host or with a real limit; under Docker Desktop the host drive is watched from outside, Docker's disk image belongs on a drive with room, and the space comes back with `fstrim -v /mnt/docker-desktop-disk` in the `docker-desktop` distribution followed by `compact vdisk` in `diskpart` with Docker stopped. The project guide names `DiskSpace` and `ShutilDiskSpace` where it lists the machine's interfaces (the clock, the factory log, the health status store). No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run python -c \"\nfrom pathlib import Path\nfrom factory.adapters.disk_space import ShutilDiskSpace\nfrom factory.domain.disk import GIGABYTE, disk_low_detail, gigabytes\nprint(ShutilDiskSpace().free_bytes(Path('.')) > 0, gigabytes(3_299_999_999))\nprint(disk_low_detail({Path('/work'): 5 * GIGABYTE - 1, Path('/state'): 9 * GIGABYTE}, 5))\n\"\n```\nExpect: two n, 40 turns, 196k tokens in (666k more from cache), 20k out, $1.30\n", "title": "The free space of a path, and its setting", "pr": 161, "state": "done", "cost": 1.3}, {"id": "F0012-S0010-the-low-disk-stop-at-every-tick", "segments": [{"stage": "ready", "role": "intake", "start": "2026-10-17T12:13:44Z", "end": "2026-10-17T12:14:02Z", "outcome": "tests", "turns": 4, "cost": 0.09, "seconds": 11}, {"stage": "tests", "role": "tester", "start": "2026-10-17T12:14:05Z", "end": "2026-10-17T12:16:52Z", "outcome": "doing", "turns": 17, "cost": 0.51, "seconds": 133}, {"stage": "doing", "role": "coder", "start": "2026-10-17T12:16:55Z", "end": "2026-10-17T12:18:59Z", "outcome": "review", "turns": 11, "cost": 0.32, "seconds": 85}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T12:19:02Z", "end": "2026-10-17T12:19:43Z", "outcome": "docs", "turns": 6, "cost": 0.24, "seconds": 37}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T12:19:46Z", "end": "2026-10-17T12:20:55Z", "outcome": "demo", "turns": 6, "cost": 0.15, "seconds": 31}, {"stage": "demo", "role": "demo", "start": "2026-10-17T12:20:58Z", "end": "2026-10-17T12:21:23Z", "outcome": "accept", "turns": 4, "cost": 0.13, "seconds": 18}], "events": [{"t": "2026-10-17T12:23:19Z", "kind": "merged"}, {"t": "2026-10-17T12:23:23Z", "kind": "booked"}], "text": "---\nstage: done\npr: 162\nblocked: null\ncomments_seen: 0\nround: 0\nattempts: 0\n---\n# The low-disk stop at every tick\n\n## Assignment (as of log entry 1)\n\nWith the free space readable (F0012-S0009), the factory stops before a write can hang: at the start of every tick, before the fetch, it reads the free space of the work directory (the checkout's parent) and of the state directory, and when either has less than `FACTORY_MIN_FREE_GB` it raises a machine stop `disk_low`, which the health status and the factory log show, and ends the tick. A free space that cannot be read is the same stop, with the error as its detail (loud over lucky). The stop is cleared by the first tick that finds enough room. One check per tick covers the preflight too, because the preflight runs inside the tick (FEATURE decision 20). The stop is a new row of `STOP_TABLE`, `disk-low`, with v1's limit L64 (the machine's own stops never reached a pull request), so the stop table's tests, the operator guide's table of stops and the document check hold it. The tests of the stop table and of the stops' scopes gain the new reason, by the human's leave (FEATURE decision 34).\n\n## Interface\n\n`src/factory/domain/stops.py`:\n\n- `RepositoryStopReason` gains `\"disk_low\"`, after `\"preflight_failed\"`.\n- The scope rule of `RepositoryStop`: the scope is `machine` for `preflight_failed` and `disk_low`, `repository` for every other reason (a `ValueError` from the model validator otherwise, as today).\n\n`src/factory/domain/stop_table.py`: `STOP_TABLE` gains, after `preflight-failed`, the row `StopRow(id=\"disk-low\", limits=(\"L64\",), destination=\"health_status\", reason=\"disk_low\", test=\"test_repository_stop_reaches_the_health_status_and_the_factory_log\")`: fifteen rows. The guide's description of the row: the work or the state directory has less free space than the setting asks for, or its free space cannot be read.\n\n`src/factory/application/tick.py`, `Tick.run`: a first step before the fetch. When `boundaries.disk` or `boundaries.settings` is `None`, it does nothing (so every test that builds boundaries without them ticks as before). Otherwise it reads `disk.free_bytes` of `settings.checkout.parent` and of `settings.state_directory`, in that order:\n\n- every path read, `disk_low_detail(free, settings.min_free_gb)` is `None`: `clear_stop(\"disk_low\")`, and the tick goes on;\n- a detail: `raise_stop(RepositoryStop(scope=\"machine\", reason=\"disk_low\", detail=<the detail>, at=<now>))`, and the tick ends with `TickOutcome(stopped=\"disk_low\")`, before the fetch;\n- an `OSError` for a path: no later path is read, the stop's detail is `cannot read the free space of <path>: <error>` for that path alone, and the tick ends the same way.\n\nTests: `tests/application/test_tick_disk.py`, on the boundaries of `tests/conftest.py` with `disk` and `settings` replaced (`dataclasses.replace`), the settings' `checkout` and `state_directory` under `tmp_path`, the handlers `{\"idle\": IdleHandler()}`, and the agents of `PIPELINE_YAML`'s roles installed with `install_agents` of `tests/git_support.py`, as `tests/application/test_tick.py` does (without them the load step stops the tick at `agent_definition_invalid`). The fake disk is `FakeDiskSpace` in a new shared helper module `tests/disk_support.py`, deriving from `DiskSpace`: it is given, per path, a byte count or an `OSError` for `free_bytes` and for `used_bytes`, raises the `OSError` it was given for a path, and keeps the paths it was asked, in order, in `asked`. F0012-S0016 and F0012-S0017 import it.\n\nBy the human's leave (FEATURE decision 34), and no other change to an earlier story's test: in `tests/domain/test_stop_table.py` the row `disk-low` joins `ROWS` after `preflight-failed`, and `test_the_table_holds_the_fourteen_stops_in_order` becomes `test_the_table_holds_the_fifteen_stops_in_order`; in `tests/test_stop_table.py`, `test_repository_stop_reaches_the_health_status_and_the_factory_log` gives `disk_low` the scope `machine`; in `tests/domain/test_stops.py`, `SCOPES` gains `(\"disk_low\", \"machine\")`; in `tests/entry/test_health.py`, `disk_low` joins the reasons of `test_every_stop_reason_makes_the_check_fail_until_it_is_cleared`.\n\n## Acceptance criteria\n\n1. A `RepositoryStop` of reason `disk_low` is accepted with scope `machine` and refused with scope `repository`; `preflight_failed` keeps its scope `machine` and every other reason `repository` (the rows of `SCOPES`).\n2. `STOP_TABLE` holds fifteen rows, `disk-low` the eighth, after `preflight-failed`, with the values of the Interface; every value of `RepositoryStopReason` is the reason of exactly one row.\n3. A tick whose fake disk gives both paths exactly `min_free_gb * GIGABYTE` bytes runs on: its outcome is not `stopped`, and the health status holds no `disk_low` stop.\n4. With the work directory one byte short, the tick ends with `TickOutcome(stopped=\"disk_low\")` before the fetch: a commit the human pushed to `main` after the checkout was cloned is not at the checkout's `origin/main` after the tick.\n5. That stop is in the health status with scope `machine` and the detail `disk_low_detail` gives for the paths read, and the factory log gains one line that ends with `stop machine disk_low: ` and that detail.\n6. With the state directory short and the work directory not, the detail names the state directory only; with both short, both, the work directory first. Rows of one parametrized test.\n7. A fake disk that raises `OSError(\"no such device\")` for the state directory stops the tick with the detail `cannot read the free space of <state directory>: no such device`; one that raises it for the work directory stops the tick with `cannot read the free space of <work directory>: no such device` and is asked for no other path, also when the state directory is short. Rows of one parametrized test.\n8. After a stopped tick, a tick with enough room clears the stop: the health status holds no `disk_low` stop and the factory log gains `stop cleared disk_low`.\n9. A tick on boundaries with a fake disk and without `settings` asks the fake for no path and runs on; a tick on boundaries without `disk` runs on. Two rows of one parametrized test.\n10. The string `disk_low` occurs as a string constant in a module of `src/factory/application` (the existing test over every reason).\n11. `make check` stays green.\n12. docs: the operator guide's table *The stops* gets the row `` `disk-low` `` (health status and factory log; the work or the state directory has less free space than `FACTORY_MIN_FREE_GB` asks for, or its free space cannot be read; what you do: make room on the file system the detail names, and nothing more, because the next tick clears the stop); its settings row for `FACTORY_MIN_FREE_GB` says what it guards; its section *The health status file* gives `disk_low` the scope `machine` beside `preflight_failed` and lists it among the reasons; its section *The stops of the tick* says that the tick reads the free space first, before the fetch. The project guide's section *The tick* names the first step and its order before the fetch. The decision log records the stop: why before the fetch, why one check per tick and not a preflight item, why an unreadable free space stops too, that the first clone of a missing checkout comes before the first check, and that on a full disk an `OSError` of the stop's own writes ends the iteration with the scheduler's `iteration failed` line. `python -m factory.entry.check_documents` prints `documents ok`.\n\n## Demo\n\n```bash\nuv run python -c \"\nfrom factory.domain.stop_table import STOP_TABLE\nrow = STOP_TABLE[7]\nprint(len(STOP_TABLE), row.id, row.destination, ','.join(row.limits), row.reason)\n\"\n```\nExpect: `15 disk-low health_status L64 disk_low`.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/application/test_tick_disk.py tests/domain/test_stop_table.py tests/test_stop_table.py\nuv run python -m factory.entry.check_documents\n```\nExpect: the pytest run's last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count; then the single line `documents ok`.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: names concrete modules and signatures: `domain/stops.py` (`RepositoryStopReason` gains `disk_low`, scope rule), `domain/stop_table.py` (the full `disk-low` row, fifteen rows), `application/tick.py` `Tick.run` (first step, no-op when `disk` or `settings` is `None`, read order, the three outcomes), the test module and the shared `FakeDiskSpace` in `tests/disk_support.py`. The human's leave for the four ea runs, 3.5 min, 32 turns, 147k tokens in (361k more from cache), 12k out, $0.88\n", "title": "Each target's time in a check's result", "pr": 164, "state": "done", "cost": 0.89}, {"id": "F0012-S0013-a-record-of-every-project-command", "segments": [{"stage": "ready", "role": "intake", "start": "2026-10-17T12:39:39Z", "end": "2026-10-17T12:39:58Z", "outcome": "tests", "turns": 5, "cost": 0.1, "seconds": 12}, {"stage": "tests", "role": "tester", "start": "2026-10-17T12:40:02Z", "end": "2026-10-17T12:43:03Z", "outcome": "doing", "turns": 18, "cost": 0.56, "seconds": 149}, {"stage": "doing", "role": "coder", "start": "2026-10-17T12:43:06Z", "end": "2026-10-17T12:45:19Z", "outcome": "review", "turns": 10, "cost": 0.34, "seconds": 94}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T12:45:22Z", "end": "2026-10-17T12:46:15Z", "outcome": "docs", "turns": 6, "cost": 0.29, "seconds": 50}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T12:46:18Z", "end": "2026-10-17T12:47:24Z", "outcome": "demo", "turns": 6, "cost": 0.12, "seconds": 28}, {"stage": "demo", "role": "demo", "start": "2026-10-17T12:47:27Z", "end": "2026-10-17T12:47:48Z", "outcome": "accept", "turns": 4, "cost": 0.13, "seconds": 15}], "events": [{"t": "2026-10-17T12:49:44Z", "kind": "merged"}, {"t": "2026-10-17T12:49:48Z", "kind": "booked"}], "text": "---\nstage: done\npr: 165\nblocked: null\ncomments_seen: 0\nround: 0\nattempts: 0\n---\n# A record of every project command\n\n## Assignment (as of log entry 1)\n\n`make check` inside agent runs took 34 % of the agents' time while v1 built v1.1, and the factory's own runs of it after each stage were not counted at all. The human's word (\"Telemetry in v1.1\") is that every project command the factory runs is a record: command, commit, duration, exit status, and for `make check` each target's time (F0012-S0012). The records also let the count of `make check` runs on one commit be measured, the lever \"skip a check whose result for that commit is known\" (FEATURE decision 22). This story wraps the project commands in a recorder that appends one JSON line per run to `records/project-commands.jsonl` in the state directory, through a small interface for append-only record files that F0012-S0016 uses again for the disk record. The records are telemetry beside the factory log, not a work item's state, so they are not committed (FEATURE decision 21). `read` has no caller in `src/factory` until F0012-S0016's disk record uses it, so the duplicates record after the coder lists it as new dead code until then; that is expected, not a finding. The wiring test that names the project commands' class changes by the human's leave (FEATURE decision 36).\n\n## Interface\n\n`src/factory/domain/command_records.py` (new):\n\n```python\nclass CommandRecord(BaseModel):\n    \"\"\"One run of a project command: what, on which commit, when, how long and how it ended.\"\"\"\n    model_config = ConfigDict(frozen=True, extra=\"forbid\")\n\n    command: CommandName\n    commit: CommitId | None\n    started_at: UtcDatetime\n    duration_seconds: Duration\n    status: CheckStatus\n    exit_status: int | None\n    targets: list[TargetTime] = []\n```\n\n`Duration` is `factory.domain.cost_records.Duration`: a float of at least 0, finite.\n\n`src/factory/application/files.py` gains:\n\n```python\nclass RecordLog[R: BaseModel](ABC):\n    \"\"\"An append-only file of records, one JSON object per line.\"\"\"\n\n    @abstractmethod\n    def append(self, record: R) -> None:\n        \"\"\"Add `record` as the last line, creating the file and its folder; `OSError` when it cannot.\"\"\"\n\n    @abstractmethod\n    def read(self) -> list[R]:\n        \"\"\"The records in file order; `[]` without a file; a line that does not validate is skipped.\"\"\"\n```\n\n`src/factory/adapters/record_log_jsonl.py` (new): `class JsonLinesRecordLog[R: BaseModel](RecordLog[R])` with `__init__(self, path: Path, model: type[R])`. `append` writes `record.model_dump_json()` and `\\n` in one write to the file opened for appending. `read` validates each non-blank line with `model.model_validate_json` and skips one that raises `ValidationError` (a kill can tear the last line).\n\n`src/factory/application/project_commands.py` gains:\n\n```python\nclass RecordingProjectCommands(ProjectCommands):\n    \"\"\"Runs the project commands of another implementation and records every run.\"\"\"\n\n    def __init__(\n        self, inner: ProjectCommands, git: Git, records: RecordLog[CommandRecord], clock: Clock, log: FactoryLog\n    ) -> None: ...\n\n    def run(self, command: str, *, time_limit: timedelta) -> CheckResult: ...\n```\n\n`run` reads `git.resolve(\"HEAD\")` (a `GitError` gives `None`), takes `clock.now()` as `started_at`, runs `inner.run`, appends `CommandRecord(command, commit, started_at, duration_seconds=<the result's duration in seconds>, status, exit_status, targets)` and returns the inner result unchanged. A `ProjectCommandError` or `ValueError` of `inner.run` propagates and records nothing. An `OSError` of `append` writes the factory log line `cannot write the record of <command>: <error>` and the result is still returned.\n\n`src/factory/entry/wiring.py`: `build_boundaries` builds `project_commands=RecordingProjectCommands(MakeProjectCommands(settings.checkout), <its GitCli>, JsonLinesRecordLog(<state directory>/records/project-commands.jsonl, CommandRecord), <its clock>, <its log>)`, the same `GitCli`, clock and log it puts into the boundaries.\n\nTests: `tests/domain/test_command_records.py`, `tests/adapters/test_record_log_jsonl.py`, `tests/application/test_recording_project_commands.py` and `tests/entry/test_wiring_command_records.py`. The recorder's inner project commands are `RecordingCommands` of `tests/application/test_preflight_run.py`, imported as `tests/application/test_interfaces.py` imports from `tests/application/test_git_interface.py`, with an `answer` that returns the given result or raises; `git` is the `checkout` fixture, the record log a `JsonLinesRecordLog` in `tmp_path`, the clock the `clock` fixture and the log a `TimestampedFactoryLog` in `tmp_path`; criterion 8's `git` is a fake written in the test whose `resolve` raises `GitError`. A new shared helper module `tests/record_support.py` holds `UnwritableRecordLog`, a `RecordLog` whose `append` raises the `OSError` it was given and whose `read` is `[]`; F0012-S0016 imports it. By the human's leave (FEATURE decision 36), and no other change to an earlier story's test: `test_build_boundaries_picks_the_concrete_adapters_and_writes_nothing` in `tests/entry/test_wiring_boundaries.py` expects `RecordingProjectCommands` for `project_commands`.\n\n## Acceptance criteria\n\n1. A `CommandRecord` with `commit=None`, `exit_status=None`, `status=\"time_limit\"` and `duration_seconds=0` is accepted; one whose `commit` is not 40 lowercase hexadecimal characters, whose `command` is `\"Check\"`, whose `duration_seconds` is `-1` or `float(\"inf\")`, whose `status` is `\"red\"` (outside `CheckStatus`), or whose `started_at` has no offset, is refused with `pydantic.ValidationError`. Rows of one parametrized test.\n2. `JsonLinesRecordLog` appends records as lines and `read` gives them back equal and in order; a missing file reads `[]`; its folder is created on the first `append`.\n3. A file whose middle line is `{\"command\":` and whose last line is `not json` reads as the valid lines only.\n4. `RecordingProjectCommands.run(\"check\", time_limit=...)` returns the inner result unchanged and appends one record with the command, the commit `HEAD` of the checkout, `started_at` equal to the clock's reading, the result's duration in seconds, its status, exit status and targets.\n5. Three runs append three records in order; a red run (exit status 2) and a run ended by its time limit (`exit_status None`, `time_limit`) are recorded as such. Rows of one parametrized test.\n6. An inner `ProjectCommandError` and an inner `ValueError` (as `MakeProjectCommands` raises for a time limit of 0) each propagate from `run`, and nothing is appended. Two rows of one parametrized test.\n7. With an `UnwritableRecordLog` whose `append` raises `OSError(\"disk full\")`, the result is still returned and the factory log gains one line `cannot write the record of check: disk full`.\n8. A checkout whose `HEAD` cannot be resolved (a `git` whose `resolve` raises `GitError`, a fake written in the test) records `commit=None`.\n9. `build_boundaries` gives `project_commands` that is a `RecordingProjectCommands`; a run of `lint` through it in the built checkout appends one record to `<state directory>/records/project-commands.jsonl`.\n10. `make check` stays green.\n11. docs: the operator guide's section on the factory log and the health status file gets a part *The records* that names `records/project-commands.jsonl` in the state directory, its fields, that it is telemetry the operator may delete, and how to count the `check` runs of one commit (one `python3 -c` line that reads the file with the `json` module; neither image has `jq`); the project guide's section *Project commands* names `RecordingProjectCommands`, `RecordLog` and `JsonLinesRecordLog`; the decision log records why the records are not committed. No other document changes, and `python -m factory.entry.check_documents` still prints `documents ok`.\n\n## Demo\n\n```bash\nuv run python -c \"\nimport tempfile\nfrom datetime import UTC, datetime\nfrom pathlib import Path\nfrom factory.adapters.record_log_jsonl import JsonLinesRecordLog\nfrom factory.domain.command_records import CommandRecord\nwith tempfile.TemporaryDirectory() as folder:\n    log = JsonLinesRecordLog(Path(folder) / 'records' / 'project-commands.jsonl', CommandRecord)\n    log.append(CommandRecord(command='check', commit='a' * 40, started_at=datetime(2026, 10, 17, tzinfo=UTC), duration_seconds=183.5, status='passed', exit_status=0))\n    print(len(log.read()), log.read()[0].command, log.read()[0].duration_seconds)\n\"\n```\nExpect: `1 check 183.5`.\n\n```bash\nuv run pytest --no-header -p no:cacheprovider tests/application/test_recording_project_commands.py tests/adapters/test_record_log_jsonl.py\n```\nExpect: the last line reads `<n> passed in <t>s`, with no `failed`, `error` or `skipped` count.\n\n## Log (append only)\n\n1. 2026-10-17 human: created.\n2. intake: accepted\n   - Interface: concrete modules and signatures throughout (domain/command_records.py, application/files.py RecordLog, adapters/record_log_jsonl.py, RecordingProjectCommands, wiring). The types it names exist: CommitId, Duration, CheckStatus, CommandName, TargetTime, UtcDatetime, Clock and FactoryLog.\n   - Criteria: each is testable by one test function or one parametrized test. Rules and their failing sides: the model's refused values (1), a torn or invalid line skipped (3), an inner error propagating with nothing appended (6), an OSError on append logged without losing the result (7), an unresolvable HEAD giving None (8). The Interface's behaviours (read order, a missing file, folder creation, unchanged result, started_at from the clock) are in 2, 4 and 5.\n   - Demo: both blocks are runnable and each Expect line is checkable (`1 check 183.5`; the pytest summary with no failed, error or skipped count).\n   - Architecture: the interface in application, the JSONL adapter in adapters, the wiring only in entry, the DTO in domain, so the layers are respected. The test changes (decision 36 leave, tests/record_support.py) are named in the story.\n   - Scope: inside F0012 scope 1.4, and not in its Out of scope.\n3. tester: Wrote red tests for criteria 1–9.\n   - criterion 1: tests/domain/test_command_records.py::test_a_command_record_accepts_valid_values_and_refuses_the_others. One parametrized test. Accepted rows: the criterion's case with duration 0, and a passed record whose commit is \"a\"*40. Refused rows: a commit of 39 characters, of 41, uppercase, and non-hex; command \"Check\"; duration -1; duratio  "start": "2026-10-17T12:57:03Z", "end": "2026-10-17T12:58:17Z", "outcome": "doing", "turns": 5, "cost": 0.08, "seconds": 43}, {"stage": "doing", "role": "coder", "start": "2026-10-17T12:58:20Z", "end": "2026-10-17T12:59:54Z", "outcome": "review", "turns": 8, "cost": 0.12, "seconds": 56}, {"stage": "review", "role": "reviewer", "start": "2026-10-17T12:59:57Z", "end": "2026-10-17T13:00:48Z", "outcome": "docs", "turns": 9, "cost": 0.23, "seconds": 48}, {"stage": "docs", "role": "documenter", "start": "2026-10-17T13:00:51Z", "end": "2026-10-17T13:02:41Z", "outcome": "demo", "turns": 6, "cost": 0.13, "seconds": 60}, {"stage": "demo", "role": "demo", "start": "2026-10-17T13:02:44Z", "end": "2026-10-17T13:03:31Z", "outcome": "accept", "turns": 4, "cost": 0.16, "seconds": 39}], "events": [{"t": "2026-10-17T13:05:27Z", "kind": "merged"}, {"t": "2026-10-17T13:05:31Z", "kind": "booked"}], "text": "---\nstage: done\npr: 166\nblocked: null\ncomments_seen: 0\nround: 1\nattempts: 0\n---\n# The model's time in an agent run's record and in the cost table\n\n## Assignment (as of log entry 1)\n\nCoder runs took 20 to 30 minutes in three turns, and nobody could tell how much of it was the model thinking and how much the tools running (`make check` above all). `claude -p --output-format json` already reports both in its reply: `duration_ms`, the whole call, and `duration_api_ms`, the time spent waiting for the model. This story reads `duration_api_ms` into the run's result as the model's time, adds it over a resumed call, and writes it into the run's cost record as `model_seconds`, next to the duration and the cost; the rest of a run's time is the tools' and the factory's (FEATURE decision 22). A reply without the field, a call killed by its time limit and an older record all leave it unknown (`None`, never 0, R24). The pinned lines of the cost record file's test gain the new key, by the human's leave (FEATURE decision 37).\n\nWith each run's model time in its cost record, the human's with `model_seconds` `None`.\n\nTests: new test functions in `tests/adapters/test_claude_runtime_resume.py` (criteria 1 to 3), with that module's `_reply`, `_budget_reply`, `_without`, `_request` and `_runtime` and the `claude` stand-in of `tests/adapters/claude_stand_in.py`, so that no reply builder is copied; `tests/domain/test_cost_record_model_seconds.py` (criterion 4); `tests/application/test_costs_model_seconds.py` (criterion 5). By the human's leave (FEATURE decision 37), and no other change to an earlier story's test: in `tests/adapters/test_cost_records_jsonl.py`, `COMPLETED_LINE` gains `\"model_seconds\":41.5` and `STARTED_LINE` `\"model_seconds\":null`, each right after `duration_seconds`, and the record `_completed()` builds gains `model_seconds=41.5`.\n\n`src/factory/domain/bills.py`:\n\n- `Bill` gains `model_duration: timedelta = timedelta(0)`, the last field: the sum of the known `model_seconds` of its records. A record whose `model_seconds` is `None` adds nothing.\n- `cost_table`: the header is `| stage | runs | min | model min | turns | in | cached | out | USD |`, the alignment row `| :-- | --: | --: | --: | --: | --: | --: | --: | --: |`, and each row and the total row carry, after `min`, the model minutes with one decimal, rounded half up like `min`.\n- `cost_line` does not change.\n\nTests: `tests/domain/test_bills_model_time.py`. By the human's leave (FEATURE decision 38), and no other change to an earlier story's test: the expected table of `test_the_cost_table_of_the_demo_stage_bills` in `tests/domain/test_bills.py` gains the column, `0.0` in each of its rows (its records have no model time).\n\n## Acceptance criteria\n\n1. A reply with `\"duration_api_ms\": 41500` gives a completed result with `model_duration == timedelta(seconds=41.5)`; a reply without the field gives `None`; a reply with `-1` gives the end reason `died`. Rows of one parametrized test.\n2. A call killed by its time limit gives `model_duration is None`, whatever its partial o
