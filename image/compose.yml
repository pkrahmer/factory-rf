# The factory's container: the container runtime restarts it (Docker, or Podman with its restart service) and reads its health from the stops in force.
name: factory-${FACTORY_INSTANCE:?set FACTORY_INSTANCE to this instance's name}
services:
  factory:
    build:
      context: ..
      dockerfile: image/Dockerfile
      args:
        FACTORY_IMAGE: ${FACTORY_IMAGE:-unlabelled}
    restart: unless-stopped
    # The runtime's init is the first process and reaps what a killed run leaves; the factory reaps only its own children.
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "factory.entry.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      FACTORY_REPOSITORY_URL: ${FACTORY_REPOSITORY_URL:?set FACTORY_REPOSITORY_URL to the project's repository}
      FACTORY_INSTANCE: ${FACTORY_INSTANCE:?set FACTORY_INSTANCE to this instance's name}
      # The agent runtime of this instance and the opencode build it runs; the defaults are the image's own.
      FACTORY_AGENT_RUNTIME: ${FACTORY_AGENT_RUNTIME:-claude}
      FACTORY_OPENCODE: ${FACTORY_OPENCODE:-opencode}
      FACTORY_OPENCODE_VERSION: ${FACTORY_OPENCODE_VERSION:-1.19.3}
      FACTORY_OPENCODE_MODELS: ${FACTORY_OPENCODE_MODELS:-opus=anthropic/claude-opus-5-5,sonnet=anthropic/claude-sonnet-5-5,haiku=anthropic/claude-haiku-5-5}
      FACTORY_OPENCODE_FOLDERS: ${FACTORY_OPENCODE_FOLDERS:-}
    volumes:
      - work:/work
      - state:/state
      - claude-home:/home/agent/.claude
      # The agent's own login, which the agent must read, so it lies outside the token's folder;
      # a missing host file makes Compose refuse to start instead of creating a folder in its place.
      - type: bind
        source: ./secrets/claude-token
        target: /home/agent/.claude-token
        read_only: true
        bind:
          create_host_path: false
      # The agent's API key, read instead of the token when it holds one; an empty file means no API key.
      - type: bind
        source: ${FACTORY_API_KEY_FILE:-./secrets/anthropic-api-key}
        target: /home/agent/.anthropic-api-key
        read_only: true
        bind:
          create_host_path: false
      # Compose ignores a file secret's owner and mode outside Swarm, so the folder, made in the
      # image for the factory's user alone, not the file, keeps the agent out.
      - type: bind
        source: ./secrets/hosting-token
        target: /home/factory/.secrets/hosting-token
        read_only: true
        bind:
          create_host_path: false
volumes:
  work:
  state:
  claude-home:
